<title>Job Explorer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF0F5; --sunken:#E5E9F0;
    --ink:#141820; --ink-2:#4A5361; --ink-3:#78818F;
    --line:#DCE1E9; --line-2:#C6CDD9;
    --accent:#1F3A6E; --accent-soft:#E7ECF6; --accent-ink:#1F3A6E;
    --alert:#B03A2E; --alert-soft:#FAEAE7;
    --warn:#8A6516; --warn-soft:#FAF1DE;
    --good:#1F6B4D; --good-soft:#E4F1EA;
    --ui:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --prose:"Source Serif 4",Georgia,"Times New Roman",serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:6px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0E1116; --surface:#161B23; --surface-2:#1D232D; --sunken:#11151B;
      --ink:#E6EAF1; --ink-2:#A3ACBA; --ink-3:#737D8C;
      --line:#262E3A; --line-2:#36404F;
      --accent:#8AA9E0; --accent-soft:#1A2335; --accent-ink:#A8C0EC;
      --alert:#E0776A; --alert-soft:#2C1A18;
      --warn:#D6A94E; --warn-soft:#2A2214;
      --good:#67B893; --good-soft:#132620;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1116; --surface:#161B23; --surface-2:#1D232D; --sunken:#11151B;
    --ink:#E6EAF1; --ink-2:#A3ACBA; --ink-3:#737D8C;
    --line:#262E3A; --line-2:#36404F;
    --accent:#8AA9E0; --accent-soft:#1A2335; --accent-ink:#A8C0EC;
    --alert:#E0776A; --alert-soft:#2C1A18;
    --warn:#D6A94E; --warn-soft:#2A2214;
    --good:#67B893; --good-soft:#132620;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5}
  a{color:var(--accent-ink)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .bar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:5}
  .bar h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .bar h1 span{color:var(--accent-ink)}
  .bar .sub{color:var(--ink-3);font-size:12.5px}
  .bar .built{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .search{flex:1 1 220px;min-width:180px;padding:7px 11px;border:1px solid var(--line-2);
    border-radius:var(--radius);background:var(--ground);color:var(--ink);font:inherit;font-size:13.5px}

  .shell{display:grid;grid-template-columns:210px minmax(300px,0.95fr) minmax(0,1.35fr);
    gap:0;align-items:start;height:calc(100vh - 53px)}
  .rail,.list,.detail{height:100%;overflow-y:auto}
  .rail{padding:16px 14px 40px;border-right:1px solid var(--line)}
  .list{border-right:1px solid var(--line);background:var(--surface)}
  .detail{padding:24px 28px 60px;background:var(--surface)}

  .facet{margin-bottom:15px}
  .facet h3{margin:0 0 6px;font-family:var(--mono);font-size:10px;text-transform:uppercase;
    letter-spacing:.09em;color:var(--ink-3);font-weight:500}
  .opts{display:flex;flex-direction:column;gap:1px}
  .opt{appearance:none;border:0;background:none;padding:3px 6px;border-radius:4px;cursor:pointer;
    display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);text-align:left}
  .opt:hover{background:var(--surface-2);color:var(--ink)}
  .opt[aria-pressed="true"]{background:var(--accent);color:#fff}
  .opt .c{font-family:var(--mono);font-size:10.5px;opacity:.65}
  .clear{appearance:none;background:none;border:1px solid var(--line-2);border-radius:var(--radius);
    padding:4px 9px;font-size:11.5px;cursor:pointer;color:var(--ink-2);width:100%;margin-bottom:14px}
  .clear:hover{border-color:var(--accent);color:var(--accent-ink)}

  .count{font-family:var(--mono);font-size:11px;color:var(--ink-3);
    padding:9px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
  .row{display:block;width:100%;appearance:none;background:none;border:0;
    border-bottom:1px solid var(--line);border-left:3px solid transparent;
    padding:10px 14px;text-align:left;cursor:pointer;display:grid;gap:4px}
  .row:hover{background:var(--surface-2)}
  .row[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
  .row.f-strong{border-left-color:var(--good)}
  .row.f-stretch{border-left-color:var(--warn)}
  .row.f-mismatch{border-left-color:var(--alert);opacity:.6}
  .row[aria-current="true"].f-strong,.row[aria-current="true"].f-stretch,
  .row[aria-current="true"].f-mismatch{border-left-color:var(--accent)}
  .row .t{font-size:13.5px;font-weight:500;line-height:1.35}
  .row .c{font-family:var(--prose);font-size:12.5px;color:var(--ink-2)}
  .row .m{font-family:var(--mono);font-size:10px;color:var(--ink-3);display:flex;gap:7px;flex-wrap:wrap}
  .row .m .pay{color:var(--good)}

  .badge{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:3px;
    background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .badge.good{background:var(--good-soft);color:var(--good);border-color:transparent}
  .badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .badge.alert{background:var(--alert-soft);color:var(--alert);border-color:transparent}
  .badge.accent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

  .detail h2{margin:0 0 2px;font-size:21px;line-height:1.25;text-wrap:balance}
  .detail .co{margin:0 0 12px;font-family:var(--prose);font-size:15px;color:var(--ink-2)}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}
  .open{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;
    text-decoration:none;padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;
    margin-bottom:18px}
  .open:hover{opacity:.9}
  .srcline{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin:0 0 18px;
    display:flex;gap:10px;flex-wrap:wrap}
  .prose{font-family:var(--prose);font-size:15px;line-height:1.66;color:var(--ink-2);max-width:66ch}
  .prose p{margin:0 0 .85em}
  .prose strong{color:var(--ink);font-weight:600}
  .prose em{font-style:italic}
  .prose h2{font-family:var(--ui);font-size:12px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--ink-3);font-weight:500;margin:1.7em 0 .6em;padding-top:.8em;border-top:1px solid var(--line)}
  .prose h3{font-family:var(--ui);font-size:14px;font-weight:700;color:var(--ink);margin:1.4em 0 .4em}
  .prose ul{margin:0 0 .9em;padding-left:1.15em}
  .prose li{margin-bottom:.32em}
  .prose code{font-family:var(--mono);font-size:.85em;background:var(--sunken);padding:1px 4px;border-radius:3px;color:var(--ink)}
  .prose table{border-collapse:collapse;margin:0 0 1em;font-family:var(--ui);font-size:13px}
  .prose th,.prose td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
  .prose th{background:var(--surface-2);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
  .empty{padding:40px 20px;color:var(--ink-3);font-size:13px;text-align:center}

  @media (max-width:980px){
    .shell{grid-template-columns:1fr;height:auto}
    .rail,.list,.detail{height:auto;overflow:visible;border-right:0}
    .rail{border-bottom:1px solid var(--line)}
    .opts{flex-direction:row;flex-wrap:wrap}
    .opt{border:1px solid var(--line);border-radius:100px;padding:2px 9px}
    .list{border-bottom:1px solid var(--line);max-height:420px;overflow-y:auto}
    .detail{padding:20px 16px 50px}
  }
</style>

</div>

<script>
const DATA = {"built": "2026-09-23", "repo": "https://github.com/mauhcs/J-job/blob/main/", "project": {"slug": "jobs", "title": "Job Explorer", "lede": "Every role found, filterable, with the full write-up on click.", "template": "explorer.template.html"}, "items": [{"id": "job-abbeal-senior-data-engineer-bank", "type": "job", "name": "Senior Data Engineer (2 positions), Digital Bank", "company": "abbeal", "track": "data-science", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "partial remote", "fit": "stretch", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "japanese": "not specified", "tags": ["jobs", "japan", "digital-bank"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Two data engineering seats at a digital bank, placed through abbeal. Digital banks are where Japanese consumer credit modelling is actually being rebuilt; the role itself is engineering.", "path": "jobs/entities/job/abbeal-senior-data-engineer-bank.md"}, {"id": "job-amex-manager-risk-management", "type": "job", "name": "Manager, Risk Management", "company": "American Express", "track": "model-risk", "industry": "banking", "country": "JP", "location": "Hiratsuka", "seniority": "manager", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "japan", "credit-risk"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Risk management at American Express in Hiratsuka, Kanagawa — outside Tokyo, which is unusual\nand may mean less competition.\n\nCard issuers run some of the most model-driven risk functions in consumer finance: credit\nscoring, fraud detection, authorisation strategy. All sequence-based, all adversarial on the\nfraud side.", "path": "jobs/entities/job/amex-manager-risk-management.md"}, {"id": "job-bah-production-engineer-quant-tokyo", "type": "job", "name": "Production Engineer (SRE/Dev), Quant Trading Firm", "company": "Via BAH Partners", "track": "quant-research", "industry": "hedge-fund", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "salary": "competitive", "tags": ["jobs", "japan", "visa-sponsorship"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Production engineering at a quantitative trading firm in Tokyo, **with visa sponsorship\nexplicitly offered**.\n\nRecruiter-advertised, so the employer is not named — but the visa sponsorship line is worth\nnoting on its own: it signals a firm willing to hire non-Japanese, which is the constraint that\nnarrows the Tokyo market most.\n\nAsk the recruiter who the client is before anything else.", "path": "jobs/entities/job/bah-production-engineer-quant-tokyo.md"}, {"id": "job-balyasny-quant-researcher-asia", "type": "job", "name": "Quantitative Researcher, Asia (Incoming MAA)", "company": "Balyasny Asset Management", "track": "quant-research", "industry": "hedge-fund", "country": "JP", "location": "Tokyo", "seniority": "senior", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "buyside", "hedge-fund", "tokyo"], "rel": ["note-job-profile-fit"], "links": [{"label": "eFinancialCareers", "url": "https://www.efinancialcareers.com/"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Multi-strategy hedge fund hiring a quantitative researcher for Asia, based in Tokyo.\n\nBuy-side research at a major multi-manager. The fit is plausible rather than strong for the\nreason in `note-job-profile-fit`: funds hiring in Asia want strong views on specific markets —\nFX, rates, credit or equity — and HFT is adjacent to rather than the same as systematic macro\nor equity research.\n\nWorth pursuing anyway. Multi-manager platforms hire across a wide range of styles, and Tokyo\nseats at these firms are scarce enough that an unusual profile can get a hearing.", "path": "jobs/entities/job/balyasny-quant-researcher-asia.md"}, {"id": "job-citadel-ai-backend-cloud", "type": "job", "name": "Backend & Cloud Engineer", "company": "Citadel AI", "track": "ml-engineering", "industry": "consulting", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 1, "confidence": "med", "japanese": "business", "tags": ["jobs", "japan", "ml-assurance", "crossover"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**Worth a second look because of what the company does, not the role.**\n\nCitadel AI builds \"next-generation machine learning infrastructure\" — the Tokyo company working\non ML model testing, monitoring and quality assurance. That is **model validation for ML\nsystems**, productised, in Japan.\n\nThis is the commercial version of what the `model-validation` project proposed selling. The\nadvertised role is backend and cloud engineering, which is not the fit — but the company is,\nand a company building ML assurance tooling needs people who understand what validation\nactually requires.\n\nApproach the company, not the requisition.", "path": "jobs/entities/job/citadel-ai-backend-cloud.md"}, {"id": "job-cryptocom-quant-researcher-oex", "type": "job", "name": "Quant Researcher, OEX", "company": "Crypto.com", "track": "defi", "industry": "crypto", "country": "US", "location": "United States", "seniority": "unstated", "work_mode": "unstated", "fit": "plausible", "verified": "listing-confirmed", "source": "web3career", "status": "idea", "priority": 3, "confidence": "low", "salary": "$100k–230k", "tags": ["jobs", "crypto", "exchange"], "rel": ["note-job-profile-fit"], "links": [{"label": "web3.career listing", "url": "https://web3.career/quantitative-researcher-jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Quantitative research on Crypto.com's derivatives exchange, band $100k–230k. They also\nadvertise a **Quantitative Researcher (Prediction Markets)** role in Dallas at $100k–150k.\n\nExchange-side quant research — pricing, margin, index construction — which is close to the\nprofile. The very wide band suggests the posting covers several grades.", "path": "jobs/entities/job/cryptocom-quant-researcher-oex.md"}, {"id": "job-datachain-blockchain-engineer", "type": "job", "name": "Blockchain Engineer (Tokenized Deposit Business)", "company": "Datachain", "track": "defi", "industry": "crypto", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "remote", "fit": "plausible", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "salary": "¥8M+", "japanese": "business", "tags": ["jobs", "japan", "crypto", "tokenization"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Tokenized deposits and stablecoin infrastructure at Datachain, remote, ¥8M+.\n\n**Tokenized deposits are where on-chain mechanics meet regulated banking** — the intersection\nthe IPOR work sits on, in a Japanese regulatory context. They also list stablecoin backend and\nfrontend lead roles at the same band.\n\nJapanese required, which is the filter. Remote.", "path": "jobs/entities/job/datachain-blockchain-engineer.md"}, {"id": "job-defi-options-quant", "type": "job", "name": "Quantitative Researcher (Options) — DeFi", "company": "Quant (via CryptocurrencyJobs)", "track": "defi", "industry": "crypto", "country": "REMOTE", "location": "Remote", "seniority": "unstated", "work_mode": "remote", "fit": "plausible", "verified": "listing-confirmed", "source": "cryptocurrencyjobs", "seen": "2026-09-23", "status": "researching", "priority": 2, "confidence": "low", "tags": ["jobs", "defi", "options", "remote"], "rel": ["note-job-profile-fit", "org-web3career"], "links": [{"label": "Listing (CryptocurrencyJobs)", "url": "https://cryptocurrencyjobs.co/other/quant-quantitative-researcher-options-defi/"}], "updated": "2026-09-23", "body": "Remote DeFi options research role, focused on **increasing the capital efficiency of the\nprotocol** by adapting capital-efficiency designs and strategies from centralised options\nexchanges and other DeFi protocols.\n\nCapital efficiency in a protocol is a margining and collateral problem — how much capital must\nbe locked against a given risk — which is a risk-modelling question wearing DeFi vocabulary.\nAdapting mechanisms from centralised exchanges also rewards knowing how those exchanges\nactually work, which is the HFT background.\n\nOptions specialisation is the gap: this wants a derivatives pricing and volatility specialist,\nwhich is adjacent to, not the same as, rates and microstructure.\n\n**Snapshot, seen 2026-09-23.** Verify it is live.", "path": "jobs/entities/job/defi-options-quant.md"}, {"id": "job-douro-labs-quant-researcher", "type": "job", "name": "Quantitative Researcher", "company": "Douro Labs", "track": "defi", "industry": "crypto", "country": "EU", "location": "Europe", "seniority": "unstated", "work_mode": "remote", "fit": "plausible", "verified": "listing-confirmed", "source": "web3career", "status": "researching", "priority": 2, "confidence": "low", "salary": "$64k–90k", "tags": ["jobs", "crypto", "oracle", "europe", "remote"], "rel": ["note-job-profile-fit"], "links": [{"label": "web3.career listing", "url": "https://web3.career/quantitative-researcher-jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Europe-based quantitative research at Douro Labs, the team behind the Pyth oracle network.\n\n**Oracles are the adjacent discipline to rate benchmarks** — both are the problem of producing\na trustworthy reference number from noisy sources that people will trade against. The IPOR\nwork sits directly next to this.\n\nCarded despite a low advertised band ($64k–90k), because it is **Europe-based rather than\nUS-only**, which puts it in a different bucket from the geo-blocked American roles. Verify\nwhether the band reflects the real level, since crypto listings routinely mix grades.", "path": "jobs/entities/job/douro-labs-quant-researcher.md"}, {"id": "job-ellipsis-labs-quant-dev-risk", "type": "job", "name": "Quantitative Developer, Risk", "company": "Ellipsis Labs", "track": "defi", "industry": "crypto", "country": "US", "location": "New York", "seniority": "senior", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "web3career", "status": "idea", "priority": 2, "confidence": "med", "salary": "$180k–250k", "tags": ["jobs", "defi", "risk", "onchain"], "rel": ["note-job-profile-fit"], "links": [{"label": "web3.career", "url": "https://web3.career/quantitative-jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Quantitative developer focused on risk at an on-chain infrastructure team, **$180k–250k**.\n\nOn-chain risk engineering — margining, liquidations, collateral and oracle behaviour — is the\nsame problem family as on-chain rate benchmark design. Different protocol, same primitives.", "path": "jobs/entities/job/ellipsis-labs-quant-dev-risk.md"}, {"id": "job-falcon-finance-quant-researcher", "type": "job", "name": "Quantitative Researcher", "company": "Falcon Finance", "track": "defi", "industry": "crypto", "country": "US", "location": "Remote — United States", "seniority": "mid-senior", "work_mode": "remote", "fit": "strong", "verified": "jd-read", "source": "direct", "status": "researching", "priority": 1, "confidence": "high", "tags": ["jobs", "crypto", "perps", "microstructure", "remote"], "rel": ["job-polymarket-quant-researcher", "note-job-profile-fit"], "links": [{"label": "Apply (Factorial)", "url": "https://falconfinance.factorialhr.com/job_posting/quantitative-researcher-273556"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**The requirements read as though written from this CV.**\n\nDesigning and testing trading signals using **market microstructure and flow dynamics**;\nresearch across **both centralised and decentralised exchanges**; building agent-based research\nautomation; incorporating market structure data into predictive models; developing **portfolio\nallocation and risk frameworks**; working with developers on production systems.\n\nRequired: advanced quantitative degree or equivalent systematic research experience;\ntime-series modelling, statistical learning or portfolio allocation; **deep understanding of\ncrypto markets, particularly perpetual futures and exchange microstructure**; Python; AI or\nagent-based tooling; familiarity with both CeFi and DeFi venues; live crypto strategy or\nproduction research experience.\n\n**That combination — HFT microstructure plus DeFi plus risk frameworks — is precisely the\nunusual overlap on the CV**, and it is rare enough that few candidates will have all three.\n\nRemote, but stated as **United States**. Verify whether that is a hiring-entity constraint or a\npreference before ruling it out; smaller crypto firms are often flexible where large ones are\nnot. No salary stated.", "path": "jobs/entities/job/falcon-finance-quant-researcher.md"}, {"id": "job-gauntlet-credit-risk-researcher", "type": "job", "name": "Credit Risk Researcher", "company": "Gauntlet", "track": "defi", "industry": "crypto", "country": "US", "location": "Remote — US & Canada only", "seniority": "3-6 years", "work_mode": "remote", "fit": "stretch", "verified": "jd-read", "source": "lever", "status": "researching", "priority": 2, "confidence": "high", "salary": "$160k–195k base + OTE + equity", "tags": ["jobs", "defi", "credit-risk", "geo-blocked"], "rel": ["note-job-profile-fit", "note-job-verification-standard", "org-gauntlet"], "links": [{"label": "Apply (Lever)", "url": "https://jobs.lever.co/gauntlet/052b6020-6b4d-4514-b2aa-3044297d63c3"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**Downgraded from strong to stretch after actually reading the posting — which is the point of\nreading postings.**\n\n**The blocker: \"Remote first — work from anywhere in the US & CAN.\"** Gauntlet's remote policy\nis contiguous US and Canada only. From Japan this role is closed without relocation. I had\nrated Gauntlet a strong fit on the basis of what the firm does, never having checked whether\nthey could employ someone in Japan.\n\n**The second gap is the discipline.** The requirement is 3–6 years of **credit** risk —\nPD/LGD modelling, loss curves, direct lending, warehouse facilities, ABS/CLO structuring,\nSPVs, covenants. That is structured credit, not rates or microstructure. On-chain credit\nprotocols and DeFi lending are listed as *preferred*, not required.\n\nSalary $160,000–195,000 base plus OTE and equity.\n\n**What it does teach:** the DeFi risk firms want conventional credit and structured finance\nskills applied to on-chain assets. That is a different profile from rate-benchmark design, and\nit reshapes which crypto roles are genuinely reachable.", "path": "jobs/entities/job/gauntlet-credit-risk-researcher.md"}, {"id": "job-gauntlet-quant-developer", "type": "job", "name": "Quant Developer", "company": "Gauntlet", "track": "defi", "industry": "crypto", "country": "US", "location": "Remote — US & Canada only", "seniority": "2-8 years", "work_mode": "remote", "fit": "plausible", "verified": "jd-read", "source": "lever", "status": "researching", "priority": 2, "confidence": "high", "salary": "$175k–200k base + equity", "tags": ["jobs", "defi", "quant", "geo-blocked"], "rel": ["note-job-profile-fit", "org-gauntlet", "task-job-gauntlet-relationship"], "links": [{"label": "Apply (Lever)", "url": "https://jobs.lever.co/gauntlet/4fa821d9-324f-465e-bf6a-b6f5eb9fa1f3"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Designing and running the strategies behind one of the largest on-chain asset managers —\nGauntlet manages **$1.5bn+ in client assets** across DeFi strategies.\n\n**The requirements read like the CV**: a track record building quantitative systems in\nproduction — explicitly *algorithmic trading*, portfolio optimisation or risk systems — Python\nwith real software engineering, optimisation, statistics and simulation, SQL and data\npipelines, and ownership of production systems including debugging live. Preferred: DeFi\nlending and AMM experience, Solidity literacy, risk modelling for volatile assets.\n\nVault strategies, signal research, gas-aware rebalancing, protocol due diligence, risk\nparameters. $175,000–200,000 base plus equity.\n\n**Same blocker: remote within contiguous US and Canada only.** The strongest-matching\nrequirements list found in this search, behind a geographic wall.\n\nIt also states the level honestly — \"2–8 years, emphasis on demonstrated work rather than\nyears\" — which is the kind of firm where an unusual profile can be argued.", "path": "jobs/entities/job/gauntlet-quant-developer.md"}, {"id": "job-imc-ml-engineer-hk", "type": "job", "name": "Machine Learning Engineer", "company": "IMC Trading", "track": "ml-engineering", "industry": "hedge-fund", "country": "HK", "location": "Hong Kong / Sydney", "seniority": "experienced", "work_mode": "onsite", "fit": "mismatch", "verified": "jd-read", "source": "imc-careers", "status": "researching", "priority": 3, "confidence": "high", "tags": ["jobs", "ml", "hongkong", "infrastructure"], "rel": ["note-job-verification-standard"], "links": [{"label": "Listing (IMC)", "url": "https://www.imc.com/ap/careers/jobs/4908869101"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**Downgraded to mismatch after reading it.** This is ML *infrastructure* engineering, not\napplied ML research.\n\nRequired: 3+ years on ML training or inference systems; strong **Python, CUDA or C++**;\nPyTorch, TensorFlow or JAX; **GPU programming** with CuDNN and TensorRT; **distributed training**\nwith Horovod and NCCL; cloud and orchestration. The work is distributed training pipelines,\nlow-latency inference, GPU optimisation and HPC collaboration.\n\nThat is a specialist systems engineer. The overlap with a quant research background is the\nlow-latency instinct and nothing else.\n\nKept as a card because it corrects an earlier rating and because it shows IMC is building in\nHong Kong — but it is not a target.", "path": "jobs/entities/job/imc-ml-engineer-hk.md"}, {"id": "job-imc-quant-researcher-futures-chicago", "type": "job", "name": "Quantitative Researcher — Futures", "company": "IMC Trading", "track": "quant-research", "industry": "hedge-fund", "country": "US", "location": "Chicago", "seniority": "5+ years", "work_mode": "onsite", "fit": "strong", "verified": "jd-read", "source": "imc-careers", "status": "researching", "priority": 1, "confidence": "high", "salary": "$250,000–300,000", "tags": ["jobs", "hft", "futures", "published-comp"], "rel": ["job-imc-quant-researcher-hft-hk", "note-job-profile-fit"], "links": [{"label": "Apply (IMC)", "url": "https://www.imc.com/us/careers/jobs/4740859101"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**The best verified match in the search, with the requirements and the pay both published.**\n\nAlpha, signal and feature research for **intraday futures strategies**; rapid prototyping of\ntrading concepts; building research infrastructure; monitoring live strategy performance;\nexploring alternative data to extend research.\n\n**Requirements, against the CV:**\n\n| required | fit |\n|---|---|\n| MSc/PhD or equivalent in a quantitative field | yes |\n| **5+ years quantitative research, preferably systematic trading, futures or high-frequency** | yes — this is the HFT background stated in their words |\n| Python, C++ or similar; large datasets | yes |\n| Statistical modelling, time-series, ML **with understanding of overfitting risks** | yes, and the overfitting emphasis favours a risk-modelling instinct |\n| Deep interest in market dynamics, **microstructure and order flow** | yes |\n\n**No China-market requirement**, unlike the Hong Kong posting — this is the same discipline\nwithout the blocking condition.\n\n**$250,000–300,000**, published. Chicago, on-site. Given relocation is open, this is the\nstrongest single application on the list.", "path": "jobs/entities/job/imc-quant-researcher-futures-chicago.md"}, {"id": "job-imc-quant-researcher-hft-hk", "type": "job", "name": "Quantitative Researcher — HFT Commodity Futures", "company": "IMC Trading", "track": "quant-research", "industry": "hedge-fund", "country": "HK", "location": "Hong Kong / Sydney", "seniority": "experienced", "work_mode": "onsite", "fit": "stretch", "verified": "jd-read", "source": "imc-careers", "status": "researching", "priority": 2, "confidence": "high", "tags": ["jobs", "hft", "hongkong", "hard-requirement"], "rel": ["job-imc-quant-researcher-futures-chicago", "note-job-profile-fit", "note-job-verification-standard"], "links": [{"label": "Apply (IMC)", "url": "https://www.imc.com/ap/careers/jobs/4785808101"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**Downgraded from strong to stretch on reading the description — I called this \"the closest\nmatch to the CV found anywhere\" before opening it.**\n\nThe work is right: high-frequency delta-one strategies in China's commodity futures and options\nmarkets, large-scale data analysis for statistically profitable predictions, alpha signal\ngeneration, market microstructure and order book dynamics, ML with a focus on robustness,\nproduction deployment with trading and engineering teams.\n\n**The requirement is the problem.** *\"3+ years of high-frequency alpha research experience in\n**China commodity futures** with proven track record.\"* Not HFT generally — that specific market.\nIt is a hard, checkable requirement and unlikely to be met.\n\nEverything else fits: probability and statistics, a mainstream ML approach, large high-frequency\ndatasets, Python, and \"a practical mindset focused on deployable, real-world edge.\"\n\n**Better target at the same firm:** `job-imc-quant-researcher-futures-chicago` — same discipline,\nno China-specific requirement, and it publishes $250k–300k.", "path": "jobs/entities/job/imc-quant-researcher-hft-hk.md"}, {"id": "job-imc-trader-digital-assets-sydney", "type": "job", "name": "Trader — Digital Assets", "company": "IMC Trading", "track": "quant-research", "industry": "hedge-fund", "country": "AU", "location": "Sydney", "seniority": "experienced", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "imc-careers", "status": "idea", "priority": 2, "confidence": "med", "tags": ["jobs", "crypto", "trading", "sydney"], "rel": ["note-job-profile-fit"], "links": [{"label": "IMC Asia-Pacific careers", "url": "https://www.imc.com/ap/search-careers"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Digital assets trading at IMC's Sydney office.\n\nCrypto plus market making at an established firm rather than a crypto-native one — the\ncombination of the IPOR background with conventional trading discipline, which is an unusual\nand defensible pairing.\n\nSydney is a genuine relocation, but it is the same time zone as Tokyo.", "path": "jobs/entities/job/imc-trader-digital-assets-sydney.md"}, {"id": "job-limit-break-unity-lead", "type": "job", "name": "Unity Lead Engineer", "company": "Limit Break", "track": "ml-engineering", "industry": "games", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "mismatch", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "japanese": "not required", "tags": ["jobs", "japan", "games", "web3", "crossover"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Carded only for the crossover: **Limit Break is a Web3 gaming company hiring in Tokyo with no\nJapanese requirement**, which connects the `game-ml` project to the crypto one.\n\nThe role — Unity engineering — is not a fit. The company is evidence that the games-plus-crypto\nintersection employs in Japan, in English.", "path": "jobs/entities/job/limit-break-unity-lead.md"}, {"id": "job-metlife-data-engineer", "type": "job", "name": "Data Engineer", "company": "Metlife", "track": "data-science", "industry": "insurance", "country": "JP", "location": "Tokyo", "seniority": "unstated", "work_mode": "onsite", "fit": "stretch", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "japan", "insurance"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Data engineering at MetLife Tokyo. Carded for completeness of the insurance-sector picture; engineering rather than modelling, and below the profile.", "path": "jobs/entities/job/metlife-data-engineer.md"}, {"id": "job-mico-senior-data-scientist", "type": "job", "name": "Senior Data Scientist", "company": "Mico", "track": "data-science", "industry": "consulting", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "salary": "¥8M–11M", "japanese": "business", "tags": ["jobs", "japan", "conversational-ai"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Senior data science at a conversational-AI company, ¥8M–11M. Business Japanese required, which is the filter. They also list a Bilingual Data Scientist / MLE role at ¥8.03M–14M.", "path": "jobs/entities/job/mico-senior-data-scientist.md"}, {"id": "job-mm-financial-risk-infrastructure", "type": "job", "name": "Financial Risk Infrastructure Specialist", "company": "Via Morgan McKinley", "track": "model-risk", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "unstated", "work_mode": "onsite", "fit": "stretch", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "salary": "¥5.5M–8M", "tags": ["jobs", "japan", "infrastructure"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Risk infrastructure in Tokyo banking at ¥5.5–8M. The band places this well below the profile; carded to show the floor of the Tokyo risk market and how wide the spread is against the ¥17–20M surveillance role.", "path": "jobs/entities/job/mm-financial-risk-infrastructure.md"}, {"id": "job-mm-trade-surveillance-tokyo", "type": "job", "name": "Securities Compliance & Trade Surveillance", "company": "Via Morgan McKinley", "track": "model-risk", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "unstated", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 1, "confidence": "med", "salary": "¥17M–20M", "tags": ["jobs", "japan", "surveillance", "high-comp"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Trade surveillance and securities compliance in Tokyo at **¥17M–20M** — among the highest\nadvertised Japanese bands found in this search, and well above the ¥14–17M quant banking role.\n\nSame subject matter as the Morgan Stanley surveillance role: detecting abusive trading\npatterns. The compliance framing suggests a broader remit than pure model building, which is\nwhy it is plausible rather than strong.\n\n**The band is the useful signal**: surveillance expertise is paid at a premium in Tokyo,\nprobably because it needs people who understand trading *and* regulation, which is a thin\nintersection — and one this CV sits in.", "path": "jobs/entities/job/mm-trade-surveillance-tokyo.md"}, {"id": "job-money-forward-senior-backend-ml-platform", "type": "job", "name": "Senior Backend Engineer, ML Platform", "company": "Money Forward", "track": "ml-engineering", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "salary": "¥7M–11M", "japanese": "business", "tags": ["jobs", "japan", "fintech"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "ML platform engineering at Money Forward, ¥7M–11M, business Japanese required.\n\n**Money Forward is the same group as Money Forward X**, carded in the data-signal project as\nan alternative-data vendor that built an AI credit model with Orico. The ML platform underneath\nthat is what this role supports.\n\nThey also list **Engineering Manager, ML Platform** at ¥10M–15M and a **Senior Data Engineer,\nMIDAS Data Platform, Digital Bank** at ¥6.5M–11M. A fintech group with a real ML organisation.", "path": "jobs/entities/job/money-forward-senior-backend-ml-platform.md"}, {"id": "job-moodys-avp-ratings-fig", "type": "job", "name": "Assistant Vice President — Ratings, Financial Institutions Group", "company": "Moody's", "track": "model-risk", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "avp", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "japan", "ratings"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Financial institutions ratings at Moody's Tokyo, AVP grade.\n\nBank ratings work means assessing capital, asset quality and risk models from the outside —\na form of independent institutional assessment, which is the theme the `model-validation`\nproject circled for weeks. Rating agencies are also one of the few employers where the\nacademic-affiliation profile reads as an asset rather than an oddity.", "path": "jobs/entities/job/moodys-avp-ratings-fig.md"}, {"id": "job-morgan-stanley-etrading-risk-vp", "type": "job", "name": "E-Trading (Risk Management), Vice President", "company": "Morgan Stanley", "track": "model-risk", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "vp", "work_mode": "onsite", "fit": "strong", "verified": "jd-read", "source": "morganstanley-careers", "status": "researching", "priority": 1, "confidence": "med", "tags": ["jobs", "etrading", "model-risk", "tokyo", "second-line"], "rel": ["note-job-ai-assurance-wave", "note-job-profile-fit"], "links": [{"label": "Apply (Morgan Stanley)", "url": "https://morganstanley.eightfold.ai/careers/job/549798184089"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**The role that joins the two halves of this repo.**\n\nSecond-line-of-defence oversight of the firm's e-trading business: independent identification,\nanalysis, reporting and escalation of risks from e-trading activity; **analysis and review of\ne-trading algorithms, including their controls and testing methods**; setting and monitoring\ne-trading risk limits; providing effective independent challenge; enhancing governance and\ncontrols; working across sales and trading, quantitative strategists, business unit risk,\ncompliance, technology and operations.\n\n**Read that again as a description of the skills.** Reviewing trading algorithms and their\ntesting methods, as an independent second line, *is* model validation — applied to the exact\nsystems an HFT background comes from. The `model-validation` project's entire subject matter,\nin a role where the candidate has also built the thing being challenged.\n\nVery few people can do both sides. Most e-trading risk officers have never written a trading\nalgorithm; most algo developers have never sat in second line.\n\nVP at a bulge-bracket bank in Tokyo, which is a credible level and an English-operating\nenvironment.\n\n**Unverified:** the description was assembled from the posting's public summary; the full\nrequirements and any Japanese-language condition still need reading on the application page.", "path": "jobs/entities/job/morgan-stanley-etrading-risk-vp.md"}, {"id": "job-morgan-stanley-surveillance-vp", "type": "job", "name": "Regional Surveillance Technical Officer, Vice President", "company": "Morgan Stanley", "track": "model-risk", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "vp", "work_mode": "onsite", "fit": "strong", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 1, "confidence": "med", "tags": ["jobs", "japan", "surveillance", "second-line"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**Market surveillance at VP level — and surveillance is the discipline this CV maps onto most\ndirectly outside trading itself.**\n\nTrade surveillance means detecting manipulation, spoofing, layering and abusive patterns in\nsequences of orders and executions. It is adversarial anomaly detection against participants\nwho are actively hiding, with asymmetric error costs. Someone who has built HFT systems knows\nwhat the patterns look like from the inside, which is exactly the knowledge a surveillance\nfunction lacks.\n\nA *technical* surveillance officer role means building and tuning the detection models rather\nthan reviewing alerts — the quantitative end of the function.\n\nMorgan Stanley Tokyo, VP grade, English-operating. Alongside their E-Trading Risk VP role, the\nsame bank has two second-line quantitative seats open.", "path": "jobs/entities/job/morgan-stanley-surveillance-vp.md"}, {"id": "job-munich-re-structurer", "type": "job", "name": "Structurer, In-Force Solutions", "company": "Munich Re", "track": "quant-research", "industry": "insurance", "country": "JP", "location": "Tokyo", "seniority": "unstated", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "japan", "insurance", "structuring"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Structuring in-force reinsurance solutions at Munich Re Tokyo.\n\nIn-force solutions means restructuring existing insurance liabilities — pricing long-dated,\noptionality-laden cashflows. Genuinely quantitative, genuinely derivative-like, and a corner of\nthe market where few people compete because it requires both actuarial and structuring\ninstincts.", "path": "jobs/entities/job/munich-re-structurer.md"}, {"id": "job-nalalys-sre", "type": "job", "name": "SRE (Site Reliability Engineer)", "company": "NaLaLys", "track": "ml-engineering", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "stretch", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "salary": "¥7.8M–10.8M", "japanese": "business", "tags": ["jobs", "japan", "fraud-detection"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "SRE at an **AI-driven fraud detection** company for enterprises, ¥7.8M–10.8M.\n\nCarded for the company rather than the role. Fraud detection is adversarial sequence\nmodelling — the same discipline as trade surveillance and cheat detection, which is the theme\nrunning through every project in this repo. A Japanese company built entirely around it is\nworth knowing.\n\nThe advertised role is infrastructure, not modelling.", "path": "jobs/entities/job/nalalys-sre.md"}, {"id": "job-nn-group-actuarial-expert", "type": "job", "name": "Actuarial Expert, Actuarial Valuation & Analysis Division", "company": "NN Group", "track": "model-risk", "industry": "insurance", "country": "JP", "location": "Tokyo", "seniority": "expert", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "japan", "actuarial"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Actuarial valuation and analysis at NN Group Tokyo.\n\nInsurance valuation is model validation by another name — checking that reserving and\nvaluation models produce defensible numbers under scrutiny. The gap is credentialing: actuarial\nroles often expect a qualification this CV does not carry, and that is a hard filter where it\napplies. Worth checking whether the posting requires it.", "path": "jobs/entities/job/nn-group-actuarial-expert.md"}, {"id": "job-noeon-backend-automated-reasoning", "type": "job", "name": "Senior Backend Engineer, Automated Reasoning (Rust)", "company": "Noeon Research", "track": "ml-engineering", "industry": "consulting", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "stretch", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "salary": "¥14M–17M", "japanese": "not required", "tags": ["jobs", "japan", "ai-research", "no-japanese"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Automated reasoning systems in Rust at an interpretable-AI research lab. ¥14M–17M, no Japanese. Strong pay and a genuinely interesting problem domain; Rust systems engineering is the gap.", "path": "jobs/entities/job/noeon-backend-automated-reasoning.md"}, {"id": "job-noeon-senior-ml-engineer", "type": "job", "name": "Senior ML Engineer (LLMOps)", "company": "Noeon Research", "track": "ml-engineering", "industry": "consulting", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 1, "confidence": "med", "salary": "¥18M–21M", "japanese": "not required", "tags": ["jobs", "japan", "ai-research", "no-japanese", "top-comp"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**The highest advertised Japanese salary found in this entire search: ¥18M–21M, with no\nJapanese required.**\n\nNoeon Research works on interpretable general intelligence — a research lab rather than a\nproduct company. LLMOps at a research lab means owning the infrastructure and evaluation\naround large models.\n\nHigher than any finance role carded in Tokyo, including the ¥17–20M surveillance band. That is\nworth knowing on its own: **Japanese AI research labs outbid Japanese banks for technical\ntalent**, and they do not require Japanese.\n\nThey also list **Senior Backend Engineer, Automated Reasoning (Rust)** at ¥14M–17M, also with\nno Japanese requirement.", "path": "jobs/entities/job/noeon-senior-ml-engineer.md"}, {"id": "job-ocbc-responsible-ai-specialist", "type": "job", "name": "Responsible AI Specialist (AVP)", "company": "OCBC", "track": "model-risk", "industry": "banking", "country": "SG", "location": "Singapore", "seniority": "avp", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "ai-assurance", "singapore", "regulatory-driven"], "rel": ["note-job-ai-assurance-wave"], "links": [{"label": "eFinancialCareers", "url": "https://www.efinancialcareers.com/"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Responsible AI specialist at AVP grade at OCBC — the third Singapore bank hiring into AI\ngovernance and assurance, alongside UOB's two roles.\n\nAVP is below the level this profile should target, so it is carded as **evidence rather than a\ntarget**: three banks, four-plus roles, one regulatory driver. That is a hiring wave, and waves\nhave senior seats that are not advertised.\n\nOCBC also advertises a **Data & AI Architect** role.", "path": "jobs/entities/job/ocbc-responsible-ai-specialist.md"}, {"id": "job-okx-quant-trader-liquidity", "type": "job", "name": "Quantitative Trader — D1 Liquidity", "company": "OKX", "track": "defi", "industry": "crypto", "country": "REMOTE", "location": "Remote", "seniority": "unstated", "work_mode": "remote", "fit": "plausible", "verified": "listing-confirmed", "source": "web3career", "status": "idea", "priority": 2, "confidence": "med", "salary": "$105k–150k", "tags": ["jobs", "crypto", "remote", "trading"], "rel": ["org-web3career"], "links": [{"label": "web3.career", "url": "https://web3.career/quantitative-jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Remote quantitative trading role in derivatives liquidity at a major exchange.\n\nRemote, at a large venue, in derivatives liquidity provision — market making, which is the HFT\ndiscipline. Compensation is well below the Polymarket band, which is the usual pattern: venue\nroles pay less than the firms trading on them.", "path": "jobs/entities/job/okx-quant-trader-liquidity.md"}, {"id": "job-paypal-data-scientist-tokyo", "type": "job", "name": "Data Scientist", "company": "PayPal", "track": "data-science", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "unstated", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "japan", "payments"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Data science at PayPal Tokyo. Payments data science means fraud, risk scoring, and behavioural\nmodelling on transaction sequences — closer to the quantitative surveillance theme than a\ngeneric data science role. PayPal also has a Senior Data Engineer opening in Tokyo.", "path": "jobs/entities/job/paypal-data-scientist-tokyo.md"}, {"id": "job-paypay-securities-backend", "type": "job", "name": "Backend Engineer", "company": "PayPay Securities", "track": "ml-engineering", "industry": "securities", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "stretch", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "japanese": "not required", "tags": ["jobs", "japan", "no-japanese", "brokerage"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Backend engineering at PayPay Securities, no Japanese required. A retail brokerage building in Japan; carded for the group picture and because English-operating securities firms in Tokyo are scarce.", "path": "jobs/entities/job/paypay-securities-backend.md"}, {"id": "job-paypay-senior-ds-ml-engineer", "type": "job", "name": "Senior Data Science Engineer / Senior ML Engineer (Applied Insights)", "company": "PayPay", "track": "data-science", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 1, "confidence": "med", "japanese": "not required", "tags": ["jobs", "japan", "payments", "no-japanese", "fintech"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Applied ML at Japan's dominant cashless payments platform. **No Japanese required.**\n\nPayPay sits on one of the largest transaction datasets in Japan, which makes this one of the\nfew places in the country where consumer-scale behavioural modelling is done at volume —\nfraud, credit, personalisation.\n\nThe PayPay group also has **PayPay Card** (AI Platform Engineer, backend roles) and **PayPay\nSecurities** (Backend Engineer, Cloud Infrastructure) hiring, several with no Japanese\nrequirement. A group worth treating as one target.", "path": "jobs/entities/job/paypay-senior-ds-ml-engineer.md"}, {"id": "job-polymarket-quant-researcher", "type": "job", "name": "Quantitative Researcher", "company": "Polymarket", "track": "defi", "industry": "crypto", "country": "US", "location": "New York", "seniority": "senior", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "web3career", "status": "researching", "priority": 1, "confidence": "med", "salary": "$250k–350k", "tags": ["jobs", "crypto", "prediction-markets", "top-comp"], "rel": ["job-falcon-finance-quant-researcher", "note-job-market-size", "note-job-profile-fit", "org-web3career"], "links": [{"label": "web3.career listing", "url": "https://web3.career/quantitative-researcher-jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**Highest advertised compensation in this search: $250,000–350,000.**\n\nThe listing specifies the work: **mark price construction and funding rate design for\nperpetual futures.**\n\nThat detail changes the assessment. Funding rate design *is* interest rate mechanism design —\nthe same object as an on-chain rate benchmark, in a perpetual futures wrapper. Mark price\nconstruction is index and oracle methodology. **This is the IPOR skill set, named explicitly,\nat the top of the compensation range.**\n\nNew York, on-site, is the obstacle. Given \"anywhere\" is on the table, this is the strongest\nargument for a relocation on the list.", "path": "jobs/entities/job/polymarket-quant-researcher.md"}, {"id": "job-polymer-capital-cpp-risk-quant", "type": "job", "name": "C++ Developer, Risk & Quant Analytics", "company": "Polymer Capital", "track": "quant-research", "industry": "hedge-fund", "country": "JP", "location": "Tokyo", "seniority": "analyst/associate", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "japan-dev", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "japan", "hedge-fund"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (Japan Dev)", "url": "https://japan-dev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Risk and quantitative analytics development at a hedge fund's Tokyo office, in C++.\n\nHedge fund risk analytics is the right subject. The grade — analyst/associate — is below the\nprofile, and it is a development role rather than a research one.\n\nCarded because hedge funds with Tokyo quant analytics teams are rare enough to be worth\nknowing about, and because an approach at the right level may be possible even when the\nadvertised seat is junior.", "path": "jobs/entities/job/polymer-capital-cpp-risk-quant.md"}, {"id": "job-scb-associate-director-quant", "type": "job", "name": "Associate Director, Quantitative Analyst (Singapore / China)", "company": "Standard Chartered", "track": "quant-research", "industry": "banking", "country": "SG", "location": "Singapore", "seniority": "associate-director", "work_mode": "onsite", "fit": "strong", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 1, "confidence": "med", "tags": ["jobs", "quant", "singapore"], "rel": ["note-job-profile-fit"], "links": [{"label": "eFinancialCareers", "url": "https://www.efinancialcareers.com/"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Associate Director quantitative analyst covering Singapore and China at Standard Chartered.\n\nCredible grade, international bank, English-operating, regional remit. Standard Chartered also\nadvertises **Manager, Valuation Methodology** and **Senior Manager, CIB Stress Testing** in\nSingapore — three quantitative seats at one bank, which suggests an active build rather than a\nsingle replacement hire.\n\nValuation methodology in particular is close to the independent-verification subject matter,\nfrom inside the institution.", "path": "jobs/entities/job/scb-associate-director-quant.md"}, {"id": "job-sp-global-quant-risk-consultant", "type": "job", "name": "Quantitative Risk Consultant", "company": "S&P Global", "track": "model-risk", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "unstated", "work_mode": "onsite", "fit": "strong", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 1, "confidence": "med", "tags": ["jobs", "model-risk", "tokyo", "vendor"], "rel": ["note-job-market-size", "note-job-profile-fit"], "links": [{"label": "eFinancialCareers", "url": "https://www.efinancialcareers.com/"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "S&P Global hiring a quantitative risk consultant in Tokyo.\n\n**Strong fit, and an unusual shape.** A vendor-side quantitative risk role means advising\nfinancial institutions on risk methodology rather than running a bank's own second line — the\nwork is closer to consulting than to in-house validation, which suits someone whose recent\nbackground is research and advisory rather than a bank seat.\n\nS&P also sells risk models and analytics, so this sits at the intersection of model\ndevelopment, client advisory and methodology — and an international employer is far more\nlikely to operate in English than a domestic group.", "path": "jobs/entities/job/sp-global-quant-risk-consultant.md"}, {"id": "job-sp-global-structured-finance-analyst", "type": "job", "name": "Senior Analyst, Credit Analysis, Structured Finance", "company": "S&P Global", "track": "model-risk", "industry": "banking", "country": "JP", "location": "Tokyo", "seniority": "senior", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "japan", "ratings"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Structured finance credit analysis at S&P Global Tokyo.\n\nStructured finance is model-heavy — cashflow waterfalls, default and prepayment assumptions,\ntranching. Adjacent to the credit-risk requirements that the DeFi risk firms turned out to want\n(`job-gauntlet-credit-risk-researcher`), which makes it interesting as a bridge rather than\nonly as a job: it builds the one thing that market asks for and this CV lacks.", "path": "jobs/entities/job/sp-global-structured-finance-analyst.md"}, {"id": "job-treasure-ai-senior-ai-engineer", "type": "job", "name": "Senior AI Engineer", "company": "Treasure AI", "track": "ml-engineering", "industry": "consulting", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "salary": "¥10M–14M", "japanese": "not required", "tags": ["jobs", "japan", "no-japanese"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Senior AI engineering at an enterprise customer data platform, ¥10M–14M, no Japanese required.\nThey also list **Senior Software Engineer — Machine Learning** at the same band, and staff-level\nroles at ¥13M–18M.\n\nEnterprise CDP work is large-scale behavioural data — segmentation, propensity, real-time\npersonalisation. Adjacent to the quantitative modelling background without being finance.", "path": "jobs/entities/job/treasure-ai-senior-ai-engineer.md"}, {"id": "job-two-sigma-production-eng-etrading", "type": "job", "name": "Production Engineer, Electronic Trading Systems", "company": "Two Sigma", "track": "quant-research", "industry": "hedge-fund", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "partial remote", "fit": "plausible", "verified": "listing-confirmed", "source": "two-sigma", "status": "researching", "priority": 1, "confidence": "med", "japanese": "not required", "tags": ["jobs", "japan", "hft", "no-japanese"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Supporting production electronic trading systems at Two Sigma's Tokyo office.\n\n**Listed as requiring no Japanese**, which is unusual for a Tokyo role and removes the single\nlargest filter on the domestic market. Partial remote.\n\nHFT-adjacent by subject matter. Engineering and reliability rather than research, so it reads\nsideways from a Chief Scientist title — but Two Sigma having three open Tokyo seats means the\noffice is building, and one conversation covers all three.", "path": "jobs/entities/job/two-sigma-production-eng-etrading.md"}, {"id": "job-two-sigma-reliability-data", "type": "job", "name": "Reliability Engineer, Data", "company": "Two Sigma", "track": "ml-engineering", "industry": "hedge-fund", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "stretch", "verified": "listing-confirmed", "source": "two-sigma", "status": "researching", "priority": 2, "confidence": "med", "japanese": "not required", "tags": ["jobs", "japan", "no-japanese"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Third open Two Sigma Tokyo seat, posted within the hour of the search. Data reliability engineering. Carded as evidence of an active build-out rather than as an individual target.", "path": "jobs/entities/job/two-sigma-reliability-data.md"}, {"id": "job-two-sigma-reliability-market-data", "type": "job", "name": "Reliability Engineer, Market Data", "company": "Two Sigma", "track": "ml-engineering", "industry": "hedge-fund", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "partial remote", "fit": "stretch", "verified": "listing-confirmed", "source": "two-sigma", "status": "researching", "priority": 2, "confidence": "med", "japanese": "not required", "tags": ["jobs", "japan", "no-japanese"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Market data reliability at Two Sigma Tokyo. No Japanese required, partial remote.\n\nMarket data infrastructure is the substrate of every quantitative strategy, and someone who\nhas consumed it in anger at high frequency understands its failure modes. But this is an SRE\nrole, and the gap between running systems and researching with them is the whole difference in\nlevel.", "path": "jobs/entities/job/two-sigma-reliability-market-data.md"}, {"id": "job-ultra-tendency-senior-data-engineer", "type": "job", "name": "Senior Data Engineer — Databricks", "company": "Ultra Tendency", "track": "data-science", "industry": "consulting", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "stretch", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 2, "confidence": "med", "salary": "¥6M–20M", "japanese": "business", "tags": ["jobs", "japan", "consulting"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Data engineering consultancy work on Databricks, with an exceptionally wide band of ¥6M–20M — which usually means the title covers several grades and the top of the range is reachable with the right profile.", "path": "jobs/entities/job/ultra-tendency-senior-data-engineer.md"}, {"id": "job-uob-vp-ai-data-assurance", "type": "job", "name": "VP, AI & Data Assurance", "company": "United Overseas Bank", "track": "model-risk", "industry": "banking", "country": "SG", "location": "Singapore", "seniority": "vp", "work_mode": "onsite", "fit": "strong", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 1, "confidence": "med", "tags": ["jobs", "ai-assurance", "singapore", "regulatory-driven"], "rel": ["note-job-ai-assurance-wave", "note-job-profile-fit", "task-job-watch-ai-assurance"], "links": [{"label": "eFinancialCareers", "url": "https://www.efinancialcareers.com/"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**The single most interesting posting in this project.**\n\nAI and data *assurance* — not AI adoption, AI **assurance** — at VP level in a major Singapore\nbank. This is the job the `model-validation` project argued would have to exist: MAS requires\nindependent validation of AI-driven models and nobody had specified how, so banks must staff\nthe function themselves.\n\nThe research done for that project is directly usable here: what the MAS guidelines require,\nhow JFSA's AI Discussion Papers compare, why validating non-stationary retrained models breaks\nthe classic playbook.\n\nUOB also advertises **First VP / VP, Responsible AI Specialist** in its Innovation Group. Two\nAI-assurance seats at one bank. See `note-job-ai-assurance-wave`.", "path": "jobs/entities/job/uob-vp-ai-data-assurance.md"}, {"id": "job-uob-vp-credit-risk-model-validation", "type": "job", "name": "VP, Credit Risk Model Validation", "company": "United Overseas Bank", "track": "model-risk", "industry": "banking", "country": "SG", "location": "Singapore", "seniority": "vp", "work_mode": "onsite", "fit": "strong", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 1, "confidence": "med", "tags": ["jobs", "model-risk", "singapore", "vp"], "rel": ["note-job-ai-assurance-wave", "note-job-profile-fit"], "links": [{"label": "eFinancialCareers", "url": "https://www.efinancialcareers.com/"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "VP-level credit risk model validation at a major Singapore bank.\n\nTextbook model validation at a credible grade, in an English-operating market. The\n`model-validation` project's research on MAS, the AI Risk Management Guidelines and the\nregional comparison applies directly.\n\nSingapore is the geography that project identified as having the clearest near-term regulatory\ntimetable — MAS guidelines final around mid-2026 with a twelve-month compliance window — and\nthis posting is what that looks like on the hiring side.", "path": "jobs/entities/job/uob-vp-credit-risk-model-validation.md"}, {"id": "job-visasq-ml-engineer", "type": "job", "name": "Machine Learning Engineer (Global Business)", "company": "VisasQ", "track": "ml-engineering", "industry": "consulting", "country": "JP", "location": "Tokyo", "seniority": "experienced", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "tokyodev", "status": "researching", "priority": 1, "confidence": "med", "salary": "¥7M–15M", "japanese": "not required", "tags": ["jobs", "japan", "expert-network", "no-japanese", "crossover"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing (TokyoDev)", "url": "https://www.tokyodev.com/jobs"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "**The same VisasQ that appears in the model-validation project as an expert network.**\n\nMachine learning for their global business, ¥7M–15M, no Japanese required.\n\nAn unusual crossover: the expert-network platform that was carded as a possible *income\nchannel* is also hiring ML engineers. Matching experts to client questions is a retrieval and\nranking problem over a 500,000-person knowledge graph.\n\nWide advertised band suggests the level is negotiable.", "path": "jobs/entities/job/visasq-ml-engineer.md"}, {"id": "job-wellington-investment-analyst", "type": "job", "name": "Investment Analyst", "company": "Wellington Management", "track": "quant-research", "industry": "asset-mgmt", "country": "JP", "location": "Tokyo", "seniority": "unstated", "work_mode": "onsite", "fit": "stretch", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "researching", "priority": 2, "confidence": "med", "tags": ["jobs", "japan", "buyside"], "rel": ["note-job-profile-fit"], "links": [{"label": "Listing", "url": "https://www.efinancialcareers.com/jobs/quantitative/in-japan"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Investment analysis at Wellington's Tokyo office. Fundamental rather than quantitative research, on current evidence — verify before dismissing, since large managers use the same title for both.", "path": "jobs/entities/job/wellington-investment-analyst.md"}, {"id": "job-xin-xiamen-crypto-quant-lead", "type": "job", "name": "Crypto Quant Strategy Lead — Trend & CTA", "company": "Xin Xiamen Capital Management (Hong Kong)", "track": "defi", "industry": "crypto", "country": "HK", "location": "Hong Kong", "seniority": "lead", "work_mode": "onsite", "fit": "plausible", "verified": "listing-confirmed", "source": "efinancialcareers", "status": "idea", "priority": 2, "confidence": "low", "tags": ["jobs", "crypto", "systematic", "hongkong"], "rel": ["note-job-profile-fit"], "links": [{"label": "eFinancialCareers", "url": "https://www.efinancialcareers.com/"}], "seen": "2026-09-23", "updated": "2026-09-23", "body": "Lead role running trend and CTA strategies in crypto, compensated on P&L.\n\nSits at the crossing point of two things on the CV — systematic trading and crypto — at lead\nlevel. The gap is style: trend-following and CTA is a specific discipline, distinct from\nmicrostructure, execution or rate-benchmark design.\n\nP&L-based compensation means this is a trading seat, not a research or risk seat. A different\nkind of job from most of this list, and worth being clear about whether that is wanted.", "path": "jobs/entities/job/xin-xiamen-crypto-quant-lead.md"}, {"id": "org-gauntlet", "type": "org", "name": "Gauntlet", "role": "buyer", "country": "GLOBAL", "industry": ["crypto", "asset-mgmt"], "size": "sme", "status": "researching", "priority": 1, "confidence": "med", "pitch": "Quantitative research on DeFi protocol economics and market risk — the closest published match to the IPOR role.", "tags": ["jobs", "defi", "target-employer", "strong-fit"], "rel": ["job-gauntlet-credit-risk-researcher", "job-gauntlet-quant-developer", "note-job-profile-fit", "org-web3career", "task-job-gauntlet-relationship"], "site": "https://www.gauntlet.xyz/", "links": [{"label": "Gauntlet", "url": "https://www.gauntlet.xyz/"}], "updated": "2026-09-23", "body": "Described in the sector literature as leading the field in **quantitative research and\noptimisation of DeFi economics**, managing market risk and ensuring economic safety for\nprotocols.\n\n**This is the closest published description of what a Chief Scientist at IPOR Labs already\ndoes.** Protocol economics, rate mechanisms, market risk, economic safety — the same object,\napproached from the risk side rather than the benchmark side.\n\nWorth watching whether or not a specific role is open: they are the reference firm in this\nniche, their published research is the standard to be measured against, and a conversation\nthere is a read on the whole market.\n\n**Also a competitor for the `data-signal` and advisory ideas** — Gauntlet sells quantitative\nrisk analysis to protocols, which is a version of independent model verification in crypto.\nCarded here as an employer; the overlap is worth noting.", "path": "jobs/entities/org/gauntlet.md"}, {"id": "org-jrecin", "type": "org", "name": "JREC-IN Portal", "name_ja": "研究者人材データベース", "role": "channel", "country": "JP", "industry": ["academia"], "status": "researching", "priority": 2, "confidence": "high", "tags": ["jobs", "academic", "official", "standing-search"], "rel": ["note-job-channels", "note-job-profile-fit", "task-job-jrecin-search"], "links": [{"label": "JREC-IN Portal", "url": "https://jrecin.jst.go.jp/seek/SeekTop"}, {"label": "Keyword search for 金融 postings", "url": "https://jrecin.jst.go.jp/seek/SeekJorSearch?fn=0&dt=0&keyword_and=%E9%87%91%E8%9E%8D"}], "updated": "2026-09-23", "body": "Japan's **official academic recruitment database**, run by the Japan Science and Technology\nAgency. Every university faculty opening in the country is posted here, searchable by field\nand keyword, with professor, associate professor, lecturer and assistant professor grades often\nadvertised together and decided by the applicant's qualifications.\n\n**Set a standing search and forget it.** Academic postings carry long lead times and fixed\ndeadlines; the cost of monitoring is a saved query. Keywords worth running: 金融工学,\nデータサイエンス, 計量, ファイナンス, リスク.\n\nAlready holding an adjunct post at TUJ makes a move to a fuller academic position a known\nquantity rather than a career change — and it is the one track compatible with everything else\nin this repo.", "path": "jobs/entities/org/jrecin.md"}, {"id": "org-morgan-mckinley", "type": "org", "name": "Morgan McKinley Japan", "role": "channel", "country": "JP", "industry": ["banking", "consulting"], "status": "researching", "priority": 1, "confidence": "high", "tags": ["jobs", "recruiter", "risk", "bilingual"], "rel": ["note-job-channels", "note-job-seniority-problem", "note-job-staleness", "task-job-call-recruiters"], "links": [{"label": "Model Validation Quant Analyst, Tokyo (bilingual risk role)", "url": "https://www.morganmckinley.com/jp/jobs/tokyo/model-validation-quant-analyst-tokyo-bilingual-risk-role/1096958"}], "updated": "2026-09-23", "body": "Recruiter covering risk and quantitative roles in Tokyo, permanent and contract.\n\n**The role that made this card interesting is gone.** Their Model Validation Quant Analyst\nposting — which two earlier passes called the most on-profile role in the search — now returns\n*\"this job opportunity is no longer available.\"* It had been carded without checking whether it\nwas live. See `note-job-staleness`.\n\n**The right use is a conversation, not an application.** Ask the consultant handling that\nmandate what else exists at a senior level that is not advertised, and whether any of it\noperates in English. That reaches the market described in `note-job-seniority-problem`.", "path": "jobs/entities/org/morgan-mckinley.md"}, {"id": "org-robert-walters", "type": "org", "name": "Robert Walters Japan", "role": "channel", "country": "JP", "industry": ["banking", "insurance", "asset-mgmt"], "status": "researching", "priority": 1, "confidence": "high", "tags": ["jobs", "recruiter", "risk", "quant"], "rel": ["note-job-channels", "note-job-seniority-problem", "task-job-call-recruiters"], "links": [{"label": "Risk & Quantitative jobs, banking and financial services", "url": "https://www.robertwalters.co.jp/en/expertise/banking-and-financial-services/risk-quantitative-jobs.html"}], "updated": "2026-09-23", "body": "Runs a **dedicated Risk & Quantitative practice** inside its banking and financial services\ndivision, with networks across Tokyo, Osaka and other cities, covering global banks, insurance\nproviders, asset managers and fintech firms.\n\nThe dedicated practice page is the useful part: a recruiter with a named risk-and-quant desk\nhas a standing mandate flow, not occasional roles. Their consultants will know which Japanese\ninstitutions are building model risk functions right now — which is the same intelligence the\n`model-validation` project spent weeks assembling from regulatory documents.\n\nEnglish-language site, which suggests they place into English-operating roles.", "path": "jobs/entities/org/robert-walters.md"}, {"id": "org-selby-jennings", "type": "org", "name": "Selby Jennings", "role": "channel", "country": "GLOBAL", "industry": ["banking", "asset-mgmt"], "status": "idea", "priority": 2, "confidence": "med", "tags": ["jobs", "recruiter", "quant", "trading"], "rel": ["note-job-channels", "task-job-call-recruiters"], "links": [{"label": "Selby Jennings — Tokyo listings", "url": "https://www.selbyjennings.com/"}], "updated": "2026-09-23", "body": "Global specialist search firm for quantitative and trading roles, active in Tokyo — currently\nlisting buy-side roles including global macro hedge fund positions.\n\nRelevant for the `quant-research` track rather than model risk. Their Tokyo mandates skew\nbuy-side, where `note-job-profile-fit` rates the fit as plausible but competitive: funds\nhiring in Japan want strong views on FX, rates, credit or equity, often at PhD level, with\nEnglish required and Japanese, Mandarin or Korean a positive.", "path": "jobs/entities/org/selby-jennings.md"}, {"id": "org-web3career", "type": "org", "name": "web3.career / CryptocurrencyJobs / CryptoJobsList", "role": "channel", "country": "GLOBAL", "industry": ["crypto"], "status": "researching", "priority": 1, "confidence": "med", "tags": ["jobs", "crypto", "remote", "defi", "best-fit-channel"], "rel": ["job-defi-options-quant", "job-okx-quant-trader-liquidity", "job-polymarket-quant-researcher", "note-job-channels", "note-job-profile-fit", "org-gauntlet", "task-job-gauntlet-relationship"], "links": [{"label": "web3.career — quantitative roles", "url": "https://web3.career/quantitative-jobs"}, {"label": "CryptocurrencyJobs", "url": "https://cryptocurrencyjobs.co/"}, {"label": "CryptoJobsList — DeFi", "url": "https://cryptojobslist.com/defi"}], "updated": "2026-09-23", "body": "The job boards for crypto and DeFi roles, heavily weighted toward **remote**.\n\n**The best-fitting channel in this project**, for three reasons. It is where the IPOR\nbackground is rarest and most valuable; it advertises senior roles openly rather than through\nrelationship networks; and remote work removes the Japanese-language and Tokyo-location\nconstraints that filter most of the domestic market.\n\n**One caution on compensation data.** Aggregate figures for
