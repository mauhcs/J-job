\"quantitative risk DeFi\" roles are\nunreliable — one source puts the US average around $90,579 with a range of $35,000–$119,000,\nwhich is implausibly low for a senior quantitative researcher and almost certainly mixes\njunior and non-quant roles into the same bucket. Take compensation from actual postings, not\nfrom aggregators.", "path": "jobs/entities/org/web3career.md"}, {"id": "note-job-ai-assurance-wave", "type": "note", "name": "The AI assurance hiring wave — the model-validation thesis, confirmed by job ads", "status": "confirmed", "priority": 1, "confidence": "high", "tags": ["jobs", "ai-assurance", "singapore", "regulatory-driven", "evidence"], "rel": ["job-morgan-stanley-etrading-risk-vp", "job-ocbc-responsible-ai-specialist", "job-uob-vp-ai-data-assurance", "job-uob-vp-credit-risk-model-validation", "note-job-profile-fit", "stream-job-search", "task-job-watch-ai-assurance"], "updated": "2026-09-23", "body": "The `model-validation` project argued that MAS, JFSA and the BoJ had all required independent\nvalidation of AI-driven models without specifying how, and that this would force institutions\nto build the capability. That was an inference from regulatory documents. **The job market now\nconfirms it.**\n\nCurrently advertised in Singapore:\n\n| role | bank | grade |\n|---|---|---|\n| **VP, AI & Data Assurance** | UOB | VP |\n| **First VP / VP, Responsible AI Specialist**, Innovation Group | UOB | (F)VP |\n| **Responsible AI Specialist** | OCBC | AVP |\n| AVP/VP, Cybersecurity — Governance, AI Trust and Assurance | Temasek International | AVP/VP |\n| VP, Credit Risk Model Validation | UOB | VP |\n| Manager, Valuation Methodology | Standard Chartered | Manager |\n\nThree major banks plus Temasek, hiring into AI governance and assurance simultaneously, in the\njurisdiction whose regulator published AI Risk Management Guidelines with a twelve-month\ncompliance window. In Japan the same pressure appears in a softer form — AIG advertising an\n\"AI Utilization Promotion Specialist\" in Tokyo, which is the adoption side rather than the\nassurance side.\n\n## What this changes\n\n**The thesis was right and the business model was wrong.** There is real, funded demand for\nindependent validation of AI models in Asian finance — but institutions are **hiring it, not\nbuying it**. That is exactly why the consulting version could not find a buyer: the budget\nexists as headcount.\n\n**Which makes this the most direct route into the work.** Months of regulatory research —\nMAS, JFSA's AI Discussion Papers, HKMA CA-G-4, why the classic validation playbook fails on\nretrained non-stationary models — is unusually strong preparation for these interviews, and\nalmost nobody applying will have done it.\n\n**And it is the answer to the seniority problem.** This is a new function. New functions do not\nhave incumbents with ten years of internal service to promote, which is precisely when an\noutside profile with an academic post and genuine quantitative depth can enter above the\nadvertised grade.\n\nSingapore leads, but the same guidance is landing in Japan and Hong Kong. Watch for the\nequivalent roles there (`task-job-watch-ai-assurance`).", "path": "jobs/notes/job-ai-assurance-wave.md"}, {"id": "note-job-channels", "type": "note", "name": "Where these roles are posted", "status": "confirmed", "priority": 1, "confidence": "high", "tags": ["jobs", "channels", "recruiters"], "rel": ["note-job-market-size", "note-job-profile-fit", "note-job-seniority-problem", "org-jrecin", "org-morgan-mckinley", "org-robert-walters", "org-selby-jennings", "org-web3career", "stream-job-search"], "updated": "2026-09-23", "body": "| channel | covers | notes |\n|---|---|---|\n| **Morgan McKinley Japan** | Risk, quant, banking — Tokyo | Carries bilingual model-validation roles; permanent and contract |\n| **Robert Walters Japan** | Dedicated **Risk & Quantitative** practice in banking and financial services | Networks in Tokyo and Osaka across global banks, insurers, asset managers and fintechs |\n| **Selby Jennings** | Global quant and trading search, active in Tokyo | Hedge fund and trading roles |\n| **eFinancialCareers** | Aggregates Tokyo quant and risk postings | Broad but noisy; good for spotting which firms are building teams |\n| **JREC-IN Portal** | **All Japanese academic posts**, run by JST | The official database; searchable by field and keyword |\n| **web3.career / CryptocurrencyJobs / CryptoJobsList** | Remote DeFi and crypto quant roles | Where the best-fitting market actually advertises |\n| **LinkedIn Japan** | Everything, including direct company posts | Volume without curation |\n\n## How to use them, given the seniority problem\n\n**Recruiters over boards.** Morgan McKinley, Robert Walters and Selby Jennings reach the\nunadvertised senior market that boards do not. One conversation with a specialist consultant\nat each is worth more than months of scanning, and it costs nothing — they are paid by the\nemployer.\n\n**Boards as intelligence.** A posting tells you an institution is building a function even\nwhen the advertised grade is wrong. Record the *employer*, not just the role.\n\n**Crypto boards as the real search.** This is the one market that advertises senior roles\nopenly and remotely, and it is where the profile is most distinctive.\n\n**JREC-IN on a standing search.** Academic postings appear with long lead times and fixed\ndeadlines; a saved keyword search costs nothing to maintain.", "path": "jobs/notes/job-channels.md"}, {"id": "note-job-market-size", "type": "note", "name": "How big the market actually is, and what it pays", "status": "confirmed", "priority": 1, "confidence": "med", "tags": ["jobs", "market-size", "compensation", "geography"], "rel": ["job-polymarket-quant-researcher", "job-sp-global-quant-risk-consultant", "note-job-channels", "note-job-profile-fit", "note-job-seniority-problem", "note-job-verification-standard", "stream-job-search", "task-job-watch-ai-assurance"], "updated": "2026-09-23", "body": "## Volume, by search\n\nResult counts on the boards, as a rough measure of market depth:\n\n| search | count |\n|---|---|\n| Model risk — Singapore (eFinancialCareers) | **465** |\n| Quantitative — Hong Kong (eFinancialCareers) | **312** |\n| Quantitative — web3.career, all remote/crypto | **235** |\n| Risk manager — Japan (eFinancialCareers) | **189** |\n| Morgan McKinley Japan, all roles | **364** |\n| Quant analyst — Tokyo (eFinancialCareers) | **22** |\n\nThese are keyword matches, not curated fits — the Japan \"risk manager\" results were mostly\nsales, operations and compliance roles rather than quantitative ones. Treat them as an\nindication of depth, not of opportunity.\n\n**The pattern is unambiguous: Singapore and Hong Kong are deeper markets than Tokyo for this\nprofile**, by an order of magnitude on quantitative risk. That is the reverse of where the\n`model-validation` project spent most of its effort.\n\n**Correction:** the Tokyo ¥14M–17M credit risk model developer figure came from a recruiter\nadvert with no named employer, and that card has been deleted per\n`note-job-verification-standard`. The number is retained here as a market signal only — it is\nan advertised band, not a verified role.\n\n## Compensation, from postings that publish it\n\n| role | market | advertised |\n|---|---|---|\n| Quantitative Researcher, Polymarket | New York, crypto | **$250k–350k** |\n| Quantitative Developer, Risk, Ellipsis Labs | New York, crypto | $180k–250k |\n| Quant Developer, **Gauntlet** (JD read) | Remote US/CAN | **$175k–200k** base + equity |\n| Credit Risk Researcher, **Gauntlet** (JD read) | Remote US/CAN | $160k–195k base + OTE |\n| Quant Researcher OEX, Crypto.com | US | $100k–230k |\n| Quantitative Trader, D1 Liquidity, OKX | Remote, crypto | $105k–150k |\n| Senior Python Engineer, quant trading (recruiter advert) | Hong Kong | HK$2M–4M |\n| Head of Market Execution (recruiter advert) | Hong Kong | up to HK$2.5M base |\n| Credit Risk Model Developer (recruiter advert) | Tokyo | ¥14M–17M |\n\n## What the numbers say\n\n**Hong Kong publishes senior compensation; Tokyo largely does not.** Hong Kong advertises\nDirector, Head-of and Lead roles with bands attached. Tokyo advertises Associate roles with\n\"competitive salary\". That is a structural difference in how the two markets hire, and it\nmeans a Tokyo-only search systematically understates what is available.\n\n**Crypto pays the most and varies the most.** A $250k–350k band and an $87k–110k band sit on\nthe same job board under similar titles. Compensation there tracks the firm, not the role —\nso judge each employer individually and never use an aggregate.\n\n**Tokyo at ¥14M–17M for a senior model developer** is a genuine number and not a bad one — it\nsimply appears far less often than the Associate postings that dominate the listings.", "path": "jobs/notes/job-market-size.md"}, {"id": "note-job-profile-fit", "type": "note", "name": "The profile, and what it is actually competitive for", "status": "confirmed", "priority": 1, "confidence": "med", "tags": ["jobs", "profile", "fit", "honesty"], "rel": ["job-abbeal-senior-data-engineer-bank", "job-amex-manager-risk-management", "job-bah-production-engineer-quant-tokyo", "job-balyasny-quant-researcher-asia", "job-citadel-ai-backend-cloud", "job-cryptocom-quant-researcher-oex", "job-datachain-blockchain-engineer", "job-defi-options-quant", "job-douro-labs-quant-researcher", "job-ellipsis-labs-quant-dev-risk", "job-falcon-finance-quant-researcher", "job-gauntlet-credit-risk-researcher", "job-gauntlet-quant-developer", "job-imc-quant-researcher-futures-chicago", "job-imc-quant-researcher-hft-hk", "job-imc-trader-digital-assets-sydney", "job-limit-break-unity-lead", "job-metlife-data-engineer", "job-mico-senior-data-scientist", "job-mm-financial-risk-infrastructure", "job-mm-trade-surveillance-tokyo", "job-money-forward-senior-backend-ml-platform", "job-moodys-avp-ratings-fig", "job-morgan-stanley-etrading-risk-vp", "job-morgan-stanley-surveillance-vp", "job-munich-re-structurer", "job-nalalys-sre", "job-nn-group-actuarial-expert", "job-noeon-backend-automated-reasoning", "job-noeon-senior-ml-engineer", "job-paypal-data-scientist-tokyo", "job-paypay-securities-backend", "job-paypay-senior-ds-ml-engineer", "job-polymarket-quant-researcher", "job-polymer-capital-cpp-risk-quant", "job-scb-associate-director-quant", "job-sp-global-quant-risk-consultant", "job-sp-global-structured-finance-analyst", "job-treasure-ai-senior-ai-engineer", "job-two-sigma-production-eng-etrading", "job-two-sigma-reliability-data", "job-two-sigma-reliability-market-data", "job-ultra-tendency-senior-data-engineer", "job-uob-vp-ai-data-assurance", "job-uob-vp-credit-risk-model-validation", "job-visasq-ml-engineer", "job-wellington-investment-analyst", "job-xin-xiamen-crypto-quant-lead", "note-job-ai-assurance-wave", "note-job-channels", "note-job-market-size", "note-job-seniority-problem", "org-gauntlet", "org-jrecin", "org-web3career", "stream-job-search", "task-job-gauntlet-relationship", "task-job-jrecin-search"], "updated": "2026-09-23", "body": "## What the CV says\n\nChief Scientist at IPOR Labs (on-chain interest rate benchmarks); Adjunct Assistant Professor\nat Temple University Japan; background in HFT, quant trading and risk modelling. Based in\nJapan.\n\n## Where that is genuinely strong\n\n**DeFi quantitative risk.** The rarest thing on the CV. Very few people have built on-chain\nrate benchmarks *and* have traditional risk modelling behind them. Firms doing quantitative\nresearch on protocol economics and market risk — Gauntlet is the clearest example — are\nlooking for exactly this combination, and it is largely remote, which removes the geography\nconstraint entirely.\n\n**Model risk in Japan.** An unusual overlap: quantitative depth, an academic post, resident in\nJapan, and — thanks to the `model-validation` project — current knowledge of JFSA's Principles,\nthe AI Discussion Papers, HKMA CA-G-4 and the MAS timetable. That research was done for a\nbusiness that did not work; as interview preparation it is worth a great deal.\n\n**Anything requiring both production trading systems and statistical rigour.** HFT experience\nsignals that models were run with money behind them, which reads differently from a research-\nonly background.\n\n## Where it is weak\n\n**Japanese language for business use.** Tokyo risk and quant roles routinely specify bilingual.\nThis is the single largest filter on the domestic market and no amount of technical fit\nsubstitutes for it.\n\n**Buy-side pedigree.** Global funds hiring in Japan want strong views on FX, rates, credit or\nequity markets and often a PhD. HFT is adjacent to, not the same as, discretionary or\nsystematic macro research.\n\n**Recency in traditional finance.** The current role is crypto-adjacent and the academic post\nis part-time. Some banks read that as distance from the field.\n\n**Game and applied ML.** No track record, per the `game-ml` project. Not a realistic job\nmarket, only a services idea.\n\n## The honest ranking\n\n1. **DeFi / protocol risk**, remote — best fit, least constrained by language or location.\n2. **Senior model risk in Japan**, at a global bank's Tokyo office or a Japanese group building\n   the function — if the language bar can be cleared or the role is English-operating.\n3. **Academic**, via JREC-IN — a known quantity, and compatible with everything else.\n4. **Quant research at a fund** — plausible but competitive, and the market wants a different\n   specialism.\n5. **Applied ML in games** — not a job market for this profile.", "path": "jobs/notes/job-profile-fit.md"}, {"id": "note-job-seniority-problem", "type": "note", "name": "The seniority problem — the advertised market is below the profile", "status": "confirmed", "priority": 1, "confidence": "med", "tags": ["jobs", "seniority", "strategy"], "rel": ["note-job-channels", "note-job-market-size", "note-job-profile-fit", "org-morgan-mckinley", "org-robert-walters", "stream-job-search", "task-job-call-recruiters"], "updated": "2026-09-23", "body": "Worth stating before any list of postings is taken seriously.\n\nThe model-risk and quant roles advertised in Tokyo are largely **Associate and VP level**.\nNomura's Risk Management department, for instance, advertises a Model Validation Quantitative\nAnalyst at **Associate** grade. Typical requirements run to a master's in a STEM field and\nprofessional experience in Python, R or VBA.\n\nFor someone holding a Chief Scientist title and a university post, that is a step down in\nseniority and, very likely, in pay.\n\n## Why this matters for how to search\n\n**Senior roles are rarely advertised.** Head-of-function, lead quant and principal researcher\npositions are filled through executive search and personal networks, which is why the public\nboards skew junior. Scanning job boards therefore samples the wrong end of the market.\n\nThree implications:\n\n1. **Use the boards as market intelligence, not as the application route.** A posting reveals\n   that an institution is building a model risk function — which is useful even when that\n   specific role is wrong.\n2. **The recruiters matter more than the postings.** Morgan McKinley, Robert Walters and Selby\n   Jennings all place senior risk and quant roles in Tokyo; a conversation with a specialist\n   recruiter reaches the unadvertised market that a board search cannot.\n3. **Remote DeFi and crypto roles are the exception.** That market advertises openly at senior\n   level and does not run on Tokyo's relationship networks.\n\n## The reframe worth considering\n\nA job search and the consulting ideas in the other projects are not separate activities.\nA senior in-house role would supply the exact thing every venture in this repo lacked — a\ntrack record, a network, and a reference — while paying for the time. Taking a role is the\ncheapest available solution to the constraint that killed three business ideas.", "path": "jobs/notes/job-seniority-problem.md"}, {"id": "note-job-staleness", "type": "note", "name": "Staleness — postings die, and the best one already had", "status": "confirmed", "priority": 1, "confidence": "high", "tags": ["jobs", "method", "staleness", "correction"], "rel": ["note-job-verification-standard", "org-morgan-mckinley", "stream-job-search", "task-job-call-recruiters"], "updated": "2026-09-23", "body": "The Model Validation Quant Analyst role in Tokyo was rated the most on-profile role in the\nsearch across two passes and made the top task in this project.\n\nOpening it returns: **\"This job opportunity is no longer available.\"**\n\nIt was carded from an aggregator listing, rated on its title, and built into a plan — without\nanyone checking whether it was open. It is the clearest single illustration of why\n`note-job-verification-standard` exists.\n\n## What follows\n\n**Check liveness before rating, not after.** A closed posting is worse than no posting: it\nproduces a confident plan aimed at nothing.\n\n**Treat every card as decaying.** Each carries a `seen` date for that reason. Anything older\nthan a few weeks should be re-opened before it is acted on, and `listing-confirmed` cards that\nhave never been opened should be assumed at risk.\n\n**A dead posting still carries one piece of information** — that the employer was building the\nfunction. That is worth a recruiter conversation even when the role has gone, which is why\n`task-job-call-recruiters` survived the deletion of the role that prompted it.", "path": "jobs/notes/job-staleness.md"}, {"id": "note-job-verification-standard", "type": "note", "name": "What counts as a job here — and what I got wrong", "status": "confirmed", "priority": 1, "confidence": "high", "tags": ["jobs", "method", "correction", "standard"], "rel": ["job-gauntlet-credit-risk-researcher", "job-imc-ml-engineer-hk", "job-imc-quant-researcher-hft-hk", "note-job-market-size", "note-job-staleness", "stream-job-search"], "updated": "2026-09-23", "body": "## The correction\n\nThe first pass produced 27 \"roles\" scraped from aggregator listing pages. Most were not\nopportunities:\n\n- **Nine had no employer** — \"Via Gravitas\", \"Via NLS\", \"Via Hays\", \"Via BAH Partners\". Those\n  are recruiters advertising their pipeline, not companies hiring.\n- **Not one job description had been opened.** Every card was a title plus a line of scrape\n  text, so nothing could be said about requirements, eligibility or level.\n- **Almost none had an application link** — several pointed at a job board's homepage.\n- **Staleness was unknown**; at least one had been posted two months earlier.\n- **Fit ratings were invented** against a profile assembled from conversation fragments.\n- **Proprietary trading firms were never searched at all** — the employers closest to an HFT\n  background. That omission alone cost the best role in the search.\n\nFourteen cards were deleted rather than left standing.\n\n## The standard now\n\nA job card requires:\n\n1. **A named employer.** No \"via recruiter\" placeholders.\n2. **A direct link** — the posting or the employer's own careers page.\n3. **A `verified` field**, one of:\n   - `jd-read` — the full description was opened; requirements and compensation are quoted.\n   - `listing-confirmed` — seen on the **employer's own site** or a board listing that names\n     the employer, but the description has not been read.\n4. **Location eligibility stated**, not assumed.\n5. **The gap named**, not just the fit.\n\n## Why it matters, in one example\n\n`org-gauntlet` was rated a **strong fit** across two earlier passes on the strength of what the\nfirm does. Opening the posting showed **\"Remote first — work from anywhere in the US & CAN\"**\nand a requirement for 3–6 years of *credit* risk — PD/LGD, ABS/CLO structuring, SPVs.\n\nFrom Japan the role is closed without relocation, and the discipline is structured credit\nrather than rates. Both facts were one click away and neither survived a scrape.\n\n## What opening postings gained\n\n**IMC Trading — Quantitative Researcher, HFT Commodity Futures, Hong Kong.** HFT quantitative\nresearch, in Asia, at an established market maker. Found by going to IMC's own careers site.\nNo aggregator surfaced it.\n\n**Polymarket** turned out to specify *mark price construction and funding rate design for\nperpetual futures* — which is interest rate mechanism design, the IPOR skill set, at $250k–350k.\nThe title alone said none of that.", "path": "jobs/notes/job-verification-standard.md"}, {"id": "task-job-call-recruiters", "type": "task", "name": "1 — Call three recruiters, not to apply", "status": "idea", "priority": 1, "decides": "Whether senior, English-operating quant and model-risk work exists in Tokyo at all — the unadvertised market boards cannot show.", "owner": "mau", "due": "2026-11-15", "confidence": "high", "tags": ["jobs", "recruiters", "intelligence"], "rel": ["note-job-seniority-problem", "note-job-staleness", "org-morgan-mckinley", "org-robert-walters", "org-selby-jennings"], "updated": "2026-09-23", "body": "The advertised market samples the wrong end (`note-job-seniority-problem`). Senior roles go\nthrough search, so the fastest way to see the real market is to ask the people running it.\nIt costs nothing — they are paid by employers.\n\n**Morgan McKinley** — the model validation role that prompted this is now closed\n(`note-job-staleness`), which makes the call more useful rather than less: ask what replaced\nit, and who else is building the function.\n**Robert Walters** — they run a named Risk & Quantitative desk, so they have standing mandate\nflow rather than occasional roles.\n**Selby Jennings** — for the buy-side quant track.\n\nAsk all three the same four questions:\n\n1. At what level does senior model risk and quant work get filled in Tokyo, and how much of it\n   is advertised?\n2. **How much operates in English?** This is the filter that decides the whole domestic market.\n3. Which institutions are building model risk functions right now?\n4. How does a Chief Scientist title with an academic post read to your clients — asset, or\n   \"not a banker\"?\n\nQuestion 3 also feeds the `model-validation` project, which spent weeks inferring the same\nthing from regulatory documents.", "path": "jobs/tasks/call-the-recruiters.md"}, {"id": "task-job-gauntlet-relationship", "type": "task", "name": "2 — Work the DeFi risk firms, knowing the US-remote wall", "status": "idea", "priority": 1, "decides": "Whether the DeFi protocol-risk market — the best profile fit and the only senior remote one — is open.", "owner": "mau", "due": "2026-12-15", "confidence": "med", "tags": ["jobs", "defi", "remote", "best-fit"], "rel": ["job-gauntlet-quant-developer", "note-job-profile-fit", "org-gauntlet", "org-web3career"], "updated": "2026-09-23", "body": "**Revised after reading Gauntlet's postings.** Their remote policy is **contiguous US and\nCanada only**, so both open roles are closed from Japan without relocation. The firm is still\nthe reference point in the niche, but it is not an application.\n\nWhat the JDs did reveal is what this market actually wants: Gauntlet's Credit Risk Researcher\nrequires 3–6 years of **credit** risk — PD/LGD, ABS/CLO, SPVs — with DeFi merely preferred.\nTheir Quant Developer role wants production quantitative systems, explicitly including\nalgorithmic trading, at $175k–200k. The second is the matching profile; the first is not.\n\n**Do not apply to a posting.** Read their published research, form an actual view on a piece of\nit, and make contact on the substance. In a niche this small, being known to the reference firm\nis worth more than a requisition being open this month, and a view on their methodology is the\nonly credential that matters.\n\n**Find the ones that can actually employ someone in Japan.** Check remote eligibility before\nanything else — it is the first filter, not the last. Douro Labs (Pyth oracles) advertises in\nEurope rather than US-only, which is the shape to look for.\n\nOther curators and risk firms worth checking for open roles and geography: **Chaos Labs**\n(currently nothing listed), **Steakhouse Financial**, **Block Analitica**, **Sentora**,\n**Paxos Labs** (advertising a DeFi researcher). These firms set risk parameters for Aave,\nCompound and Morpho — the closest commercial neighbours to the IPOR work.\n\n**Take compensation from actual postings**, never from aggregators: one source puts DeFi\nquantitative risk at a $90,579 US average, which is implausible for senior work and clearly\nmixes grades.", "path": "jobs/tasks/gauntlet-relationship.md"}, {"id": "task-job-jrecin-search", "type": "task", "name": "3 — Set a standing JREC-IN search", "status": "idea", "priority": 2, "owner": "mau", "due": "2026-10-31", "confidence": "high", "tags": ["jobs", "academic", "low-effort"], "rel": ["note-job-profile-fit", "org-jrecin"], "updated": "2026-09-23", "body": "JREC-IN carries every Japanese university faculty opening. Academic postings run on long lead\ntimes and fixed deadlines, so the only sensible approach is a saved search that costs nothing\nto maintain.\n\nKeywords: 金融工学, ファイナンス, データサイエンス, 計量, リスク. Watch for postings that\nadvertise professor through assistant professor together and let qualifications decide the\ngrade — those are the ones where an unusual profile can land above the nominal entry level.\n\nAlready holding the TUJ adjunct post makes this a known quantity rather than a career change,\nand it is the one track compatible with everything else in this repo.", "path": "jobs/tasks/jrecin-standing-search.md"}, {"id": "task-job-watch-ai-assurance", "type": "task", "name": "4 — Track the AI assurance roles as they spread north", "status": "idea", "priority": 2, "owner": "claude", "due": "2026-12-31", "confidence": "high", "tags": ["jobs", "ai-assurance", "monitoring"], "rel": ["job-uob-vp-ai-data-assurance", "note-job-ai-assurance-wave", "note-job-market-size"], "updated": "2026-09-23", "body": "Singapore has three banks plus Temasek hiring into AI governance and assurance at once, driven\nby MAS guidance on a twelve-month compliance clock. Japan and Hong Kong are under equivalent\npressure from JFSA's AI Discussion Papers and HKMA's supervisory framework, on a slower\ntimetable.\n\nRun a standing search for the equivalent titles as they appear: AI assurance, responsible AI,\nAI model validation, AI governance, model risk — in Tokyo and Hong Kong, at the megabanks,\ntrust banks, major insurers and the Tokyo offices of global banks.\n\n**This is the single best-matched work in the whole repo**, because the months of regulatory\nresearch already done are the preparation nobody else applying will have. Being early to the\nJapanese and Hong Kong versions of these roles is worth more than anything else on the\nwatchlist.", "path": "jobs/tasks/watch-ai-assurance.md"}, {"id": "stream-job-search", "type": "stream", "name": "The search — what to look for and where it is posted", "status": "researching", "priority": 1, "confidence": "med", "tags": ["jobs", "search", "channels"], "rel": ["note-job-ai-assurance-wave", "note-job-channels", "note-job-market-size", "note-job-profile-fit", "note-job-seniority-problem", "note-job-staleness", "note-job-verification-standard"], "updated": "2026-09-23", "body": "## Question\n\nWhich roles genuinely fit a profile of HFT and quant trading, risk modelling, on-chain rate\nbenchmark design, and an academic post — and where are they actually advertised?\n\n## Six tracks worth watching\n\n| track | why it fits | where posted |\n|---|---|---|\n| `model-risk` | JFSA's Principles drove a hiring wave; the whole `model-validation` project is background research for it | Morgan McKinley, Robert Walters, eFinancialCareers |\n| `quant-research` | Direct match on HFT and trading | Selby Jennings, eFinancialCareers, LinkedIn |\n| `defi` | The IPOR role is rare and in demand | web3.career, CryptocurrencyJobs, direct |\n| `academic` | TUJ post already held | JREC-IN |\n| `ml-engineering` | Applied ML, including the game industry | LinkedIn, company sites |\n| `advisory` | Expert networks, benchmark oversight, outside-director seats | Covered in `model-validation` |\n\n## The uncomfortable structural point\n\nSee `note-job-seniority-problem`. Most advertised quant and model-risk roles in Tokyo are\nassociate or VP level and would be a **step down** from Chief Scientist. The advertised market\nand the appropriate market are not the same market, which shapes where to look rather than\nwhether to look.\n\n## Current state\n\nChannels mapped and a handful of real roles carded. No applications, no conversations. The\nlistings here are snapshots and go stale — each carries the date it was seen.", "path": "jobs/streams/search.md"}], "sources": [], "pool": []};
const JOBS = DATA.items.filter(i => i.type === "job");
const NOTES = DATA.items.filter(i => i.type !== "job");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FIT_ORDER = ["strong","plausible","stretch","mismatch"];
const FIT_CLASS = {strong:"good", plausible:"accent", stretch:"warn", mismatch:"alert"};

function md(src){
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, (_,c) => `<code>${c}</code>`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_,t2,u) => `<a href="${u}" target="_blank" rel="noopener">${t2}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  const out = []; let list = null, para = [], tbl = null;
  const fp = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const fl = () => { if (list) { out.push(`<ul>${list.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); list = null; } };
  const ft = () => { if (tbl) { out.push(`<table>${tbl}</table>`); tbl = null; } };
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  for (const raw of src.split("\n")) {
    const line = raw.trimEnd();
    const h = line.match(/^(#{2,3})\s+(.*)$/);
    const li = line.match(/^[-*]\s+(.*)$/);
    const isRow = /^\s*\|.*\|\s*$/.test(line);
    if (isRow) {
      fp(); fl();
      if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue;
      const tag = tbl === null ? "th" : "td";
      tbl = (tbl || "") + `<tr>${cells(line).map(c => `<${tag}>${inline(c)}</${tag}>`).join("")}</tr>`;
    }
    else if (h) { fp(); fl(); ft(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); }
    else if (li) { fp(); ft(); (list ??= []).push(li[1]); }
    else if (!line.trim()) { fp(); fl(); ft(); }
    else if (list) { list[list.length - 1] += " " + line.trim(); }
    else { ft(); para.push(line.trim()); }
  }
  fp(); fl(); ft();
  return out.join("\n");
}

const FACETS = [
  {k:"fit", label:"Fit", order:FIT_ORDER},
  {k:"track", label:"Role"},
  {k:"industry", label:"Industry"},
  {k:"country", label:"Country"},
  {k:"location", label:"City"},
  {k:"japanese", label:"Japanese"},
  {k:"seniority", label:"Seniority"},
  {k:"work_mode", label:"Work mode"},
  {k:"company", label:"Company"},
  {k:"verified", label:"Verified"},
];
const on = {};
let q = "", current = null;

const matches = j => FACETS.every(f => !on[f.k] || j[f.k] === on[f.k])
  && (!q || [j.name, j.company, j.location, j.body, (j.tags||[]).join(" ")].join(" ").toLowerCase().includes(q));

function visible(){
  return JOBS.filter(matches).sort((a,b) =>
    FIT_ORDER.indexOf(a.fit) - FIT_ORDER.indexOf(b.fit)
    || (a.priority||9) - (b.priority||9)
    || String(a.company).localeCompare(String(b.company)));
}

function renderFacets(){
  const pool = JOBS.filter(matches);
  document.getElementById("facets").innerHTML = FACETS.map(f => {
    const c = new Map();
    for (const j of (on[f.k] ? JOBS : pool)) if (j[f.k]) c.set(j[f.k], (c.get(j[f.k])||0) + 1);
    if (c.size < 2 && !on[f.k]) return "";
    const entries = [...c.entries()].sort((a,b) => f.order
      ? f.order.indexOf(a[0]) - f.order.indexOf(b[0])
      : b[1]-a[1] || String(a[0]).localeCompare(String(b[0])));
    return `<div class="facet"><h3>${f.label}</h3><div class="opts">${entries.map(([v,n]) =>
      `<button class="opt" type="button" data-k="${f.k}" data-v="${esc(v)}"
        aria-pressed="${on[f.k] === v}"><span>${esc(v)}</span><span class="c">${n}</span></button>`
    ).join("")}</div></div>`;
  }).join("");
}

function renderRows(){
  const list = visible();
  document.getElementById("count").textContent =
    `${list.length} of ${JOBS.length} roles` + (Object.values(on).filter(Boolean).length || q ? " · filtered" : "");
  document.getElementById("rows").innerHTML = list.length ? list.map(j => `
    <button class="row f-${esc(j.fit)}" type="button" data-id="${esc(j.id)}" aria-current="${j.id === current}">
      <span class="t">${esc(j.name)}</span>
      <span class="c">${esc(j.company)}</span>
      <span class="m">
        <span>${esc(j.location || j.country)}</span>
        <span>${esc(j.track)}</span>
        ${j.salary ? `<span class="pay">${esc(j.salary)}</span>` : ""}
        ${j.japanese ? `<span>JP: ${esc(j.japanese)}</span>` : ""}
      </span>
    </button>`).join("") : `<p class="empty">No roles match. Clear a filter.</p>`;
}

function select(id){
  current = id;
  const j = JOBS.find(x => x.id === id);
  const d = document.getElementById("detail");
  if (!j) { d.innerHTML = `<p class="empty">Select a role to read it in full.</p>`; return; }
  const b = [];
  b.push(`<span class="badge ${FIT_CLASS[j.fit]||""}">${esc(j.fit)} fit</span>`);
  b.push(`<span class="badge ${j.verified === "jd-read" ? "good" : "warn"}">${esc(j.verified)}</span>`);
  for (const [k,v] of [["track",j.track],["industry",j.industry],["seniority",j.seniority],
                       ["work mode",j.work_mode],["Japanese",j.japanese]])
    if (v && v !== "unstated") b.push(`<span class="badge">${k}: ${esc(v)}</span>`);
  if (j.salary) b.push(`<span class="badge good">${esc(j.salary)}</span>`);
  const primary = (j.links || [])[0];
  d.innerHTML = `
    <h2>${esc(j.name)}</h2>
    <p class="co">${esc(j.company)} · ${esc(j.location || j.country)}</p>
    <div class="badges">${b.join("")}</div>
    ${primary ? `<a class="open" href="${esc(primary.url)}" target="_blank" rel="noopener">Open original listing ↗</a>` : ""}
    <p class="srcline">
      <span>source: ${esc(j.source || "—")}</span><span>seen: ${esc(j.seen || j.updated)}</span>
      ${j.posted ? `<span>posted: ${esc(j.posted)}</span>` : ""}
      <span>listings go stale — verify before acting</span>
    </p>
    <div class="prose">${md(j.body || "")}</div>
    ${(j.links || []).length > 1 ? `<h3 class="prose" style="font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-top:22px">More links</h3>
      <div class="prose"><ul>${j.links.slice(1).map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join("")}</ul></div>` : ""}
    ${NOTES.length ? `<p class="srcline" style="margin-top:26px;padding-top:14px;border-top:1px solid var(--line)">
      background: ${NOTES.filter(n => n.type === "note").map(n => esc(n.name)).slice(0,4).join(" · ")}</p>` : ""}`;
  d.scrollTop = 0;
  document.querySelectorAll("#rows .row").forEach(r =>
    r.setAttribute("aria-current", String(r.dataset.id === id)));
}

document.getElementById("facets").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  on[b.dataset.k] = on[b.dataset.k] === b.dataset.v ? undefined : b.dataset.v;
  renderFacets(); renderRows();
});
document.getElementById("rows").addEventListener("click", e => {
  const r = e.target.closest("[data-id]"); if (r) select(r.dataset.id);
});
document.getElementById("q").addEventListener("input", e => {
  q = e.target.value.trim().toLowerCase(); renderFacets(); renderRows();
});
document.getElementById("clear").addEventListener("click", () => {
  for (const k of Object.keys(on)) delete on[k];
  q = ""; document.getElementById("q").value = "";
  renderFacets(); renderRows();
});

try {
  document.getElementById("ttl").innerHTML = `J-job <span>${esc(DATA.project.title)}</span>`;
  document.getElementById("sub").textContent = DATA.project.lede;
  document.getElementById("built").textContent = "built " + DATA.built;
  renderFacets(); renderRows();
  select(visible()[0]?.id);
} catch (err) {
  document.getElementById("rows").innerHTML =
    `<p class="empty">This page failed to render: ${esc(err && err.message)}</p>`;
  throw err;
}
</script>
