# Sources companies are harvested from. Register a source here before harvesting it.
# kind: register | association | award | database | editorial  (see INTAKE.md for trust levels)

sources:
  - id: shotan-kyokai
    name: 日本少額短期保険協会 — 会員一覧
    url: https://www.shougakutanki.jp/general/about/membership.html
    kind: association
    jurisdiction: JP
    authority: 日本少額短期保険協会
    yields: 123 正会員 + 1 準会員 + 30 賛助会員, each with its own website
    cadence: quarterly
    harvested: 2026-09-22
    rows_captured: 122
    rows_expected: 123
    note: >
      Highest-yield source found so far. WARNING: the TSV was transcribed by hand from a
      fetched copy of the page and captured 122 of 123 正会員 — one row was lost in
      transcription and has not been reconciled. Re-harvest this source programmatically
      before trusting it as complete (task-reharvest-shotan). Filter captives (Tokio Marine, SBI, Aflac, Chubb,
      Rakuten, au, 東急, 積水ハウス group subsidiaries) — for those the FSA's own remedy of
      leaning on the parent group is available, which weakens the pitch.

  - id: fintech-kyokai
    name: 一般社団法人Fintech協会 — ベンチャー会員
    url: https://fintechjapan.org/startup/
    kind: association
    jurisdiction: JP
    authority: Fintech協会
    yields: members categorised by the association itself (融資・ローン, 保険, ALM・リスク管理, スコアリング)
    cadence: quarterly
    harvested: 2026-09-22
    note: The association's own categorisation is the useful part — it pre-sorts by model type.

  - id: fsa-kashikingyo-register
    name: 金融庁・財務局 貸金業者登録一覧
    url: https://www.fsa.go.jp/
    kind: register
    jurisdiction: JP
    authority: 金融庁 / 財務局
    yields: every licensed moneylender in Japan
    cadence: quarterly
    harvested: null
    note: >
      NOT YET HARVESTED. The authoritative list. Being on it is proof of licensing and
      therefore of supervision, which is the premise of the SME pitch — currently we infer
      licensing from association membership instead. Locate the exact register URL first.

  - id: fsa-shotan-register
    name: 金融庁 少額短期保険業者 登録一覧
    url: https://www.fsa.go.jp/
    kind: register
    jurisdiction: JP
    authority: 金融庁 / 財務局
    yields: every registered micro-insurer, including non-association members
    cadence: quarterly
    harvested: null
    note: NOT YET HARVESTED. Superset of the association list; catches firms outside the body.

  - id: hkma-ai-register
    name: HKMA Register of Authorized Institutions
    url: https://www.hkma.gov.hk/eng/
    kind: register
    jurisdiction: HK
    authority: Hong Kong Monetary Authority
    yields: all authorized institutions; the eight Licensed Digital Banks
    cadence: quarterly
    harvested: null
    note: >
      NOT YET HARVESTED. Also the route to identifying which institutions use IRB and
      therefore fall under CA-G-4 validation expectations. The HK digital bank set currently
      in the repo came from comparison blogs, not from this register.

  - id: finopitch-tfa
    name: FINOPITCH / Tokyo Financial Award finalists
    url: https://www.finsum.jp/startup.html
    kind: award
    jurisdiction: JP
    authority: Tokyo Metropolitan Government / JETRO
    yields: pre-qualified model-driven fintechs, last three years of finalists
    cadence: annual
    harvested: null
    note: Garage Bank won the JETRO Award at FINOPITCH 2025 and a Tokyo Financial Award in 2024.

  - id: tracxn-alt-lending-jp
    name: Tracxn — alternative lending startups in Japan
    url: https://tracxn.com/d/explore/alternative-lending-startups-in-japan/__RpbITwnFhX7vmsyCXWmV0lJsCUhicLYtNSnNuATU_uQ/companies
    kind: database
    jurisdiction: JP
    authority: Tracxn
    yields: 39 companies, 24 funded, 13 at Series A+
    cadence: annual
    harvested: 2026-09-22
    note: >
      Used only via search summaries so far — the listing page itself has not been opened.
      Coverage and freshness unverified. Treat names from here as leads to confirm, not facts.

  - id: sangaku-finance-prs
    name: 産学連携 press releases in Japanese finance (purposive sample)
    url: https://prtimes.jp/topics/keywords/%E5%85%B1%E5%90%8C%E7%A0%94%E7%A9%B6
    kind: editorial
    purpose: evidence
    jurisdiction: JP
    authority: PR TIMES / company newsrooms
    yields: observations of finance companies commissioning academic research
    cadence: annual
    harvested: 2026-09-22
    rows_captured: 16
    note: >
      NOT A COUNT. A purposive sample found by targeted search, establishing existence and
      pattern only. PR TIMES keyword totals are loose full-text matches and are unusable as a
      measure - 共同研究 銀行 reports 3,178 results of which the top 40 were mostly unrelated.
      Rows here are evidence for note-sangaku-field-evidence, not target companies.
